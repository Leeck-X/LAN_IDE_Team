<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN C++26 IDE - 实时协同</title>
    <style>
        /* ===== 深色主题 (GitHub Dark) ===== */
        :root{
            --bg-0:#0d1117;
            --bg-1:#161b22;
            --bg-2:#1c2128;
            --line:#30363d;
            --text-hi:#e6edf3;
            --text-mid:#9aa4b2;
            --text-lo:#6e7681;
            --brass:#d4a24a;
            --brass-dim:#8a713a;
            --brass-glow:rgba(212,162,74,.35);
            --ok:#5fb987;
            --err:#f85149;
            --warn:#d29922;
            --info:#58a6ff;
            --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
            --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
            --shadow-sm:0 1px 3px rgba(0,0,0,.4);
            --shadow-md:0 4px 12px rgba(0,0,0,.45);
            --shadow-lg:0 10px 28px rgba(0,0,0,.55);
            --radius:8px;
            --transition:all .18s cubic-bezier(.4,0,.2,1);
        }
        *{box-sizing:border-box;}
        html,body{height:100%;margin:0;}
        body{
            font-family:var(--sans);
            background:var(--bg-0);
            color:var(--text-hi);
            display:flex;
            flex-direction:column;
            overflow:hidden;
        }
        /* 自定义滚动条 */
        ::-webkit-scrollbar{width:8px;height:8px;}
        ::-webkit-scrollbar-track{background:transparent;}
        ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
        ::-webkit-scrollbar-thumb:hover{background:var(--text-lo);}
        /* 脉冲呼吸动画 */
        @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(95,185,135,.45);}50%{box-shadow:0 0 0 5px transparent;}}
        @keyframes dropIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
        @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
        /* Toast 通知 */
        #toast-container{
            position:fixed;top:60px;right:20px;z-index:9999;
            display:flex;flex-direction:column;gap:8px;
        }
        .toast{
            min-width:200px;max-width:320px;padding:10px 16px;
            background:rgba(28,33,40,.8);backdrop-filter:blur(8px);
            border:1px solid var(--line);
            border-left:3px solid var(--brass);border-radius:var(--radius);
            color:var(--text-hi);font-size:13px;
            box-shadow:var(--shadow-md);
            animation:slideIn .28s cubic-bezier(.4,0,.2,1), fadeOut .5s ease 3s forwards;
            display:flex;align-items:center;justify-content:space-between;
        }
        .toast.success{border-left-color:var(--ok);}
        .toast.error{border-left-color:var(--err);}
        .toast.warning{border-left-color:var(--warn);}
        .toast .toast-close{background:none;border:none;color:var(--text-lo);cursor:pointer;font-size:16px;margin-left:10px;padding:0 2px;}
        .toast .toast-close:hover{color:var(--text-hi);}
        @keyframes slideIn{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
        @keyframes fadeOut{to{opacity:0;transform:translateY(-10px);}}

        /* 确认对话框 */
        .modal-overlay{
            position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);
            backdrop-filter:blur(3px);
            z-index:10000;display:flex;align-items:center;justify-content:center;
            animation:fadeIn .18s ease;
        }
        .modal{background:var(--bg-1);border:1px solid var(--line);border-radius:12px;padding:20px;width:360px;box-shadow:var(--shadow-lg);animation:dropIn .2s cubic-bezier(.4,0,.2,1);}
        .modal h3{margin:0 0 10px;font-size:16px;color:var(--text-hi);}
        .modal p{font-size:14px;color:var(--text-mid);margin:0 0 20px;}
        .modal .modal-buttons{display:flex;justify-content:flex-end;gap:8px;}
        .modal-input{width:100%;background:var(--bg-2);border:1px solid var(--line);color:var(--text-hi);font-size:14px;padding:8px 10px;border-radius:6px;font-family:var(--mono);margin-bottom:16px;outline:none;}
        .modal-input:focus{border-color:var(--brass);}

        /* 下拉菜单 */
        .dropdown{position:relative;display:inline-block;}
        .dropdown-menu{
            position:absolute;top:calc(100% + 4px);right:0;min-width:150px;
            background:var(--bg-2);border:1px solid var(--line);border-radius:8px;
            box-shadow:var(--shadow-lg);padding:4px;z-index:200;
            display:none;flex-direction:column;
            animation:dropIn .15s ease;
        }
        .dropdown.open .dropdown-menu{display:flex;}
        .dropdown-item{
            background:none;border:none;color:var(--text-mid);cursor:pointer;
            font-size:12.5px;padding:8px 12px;border-radius:5px;text-align:left;
            font-family:var(--sans);transition:var(--transition);white-space:nowrap;
        }
        .dropdown-item:hover{background:var(--bg-1);color:var(--brass);}

        /* 导入测试点模态框 */
        .import-modal{width:440px;max-height:72vh;display:flex;flex-direction:column;}
        .import-list{overflow-y:auto;max-height:320px;margin-bottom:16px;display:flex;flex-direction:column;gap:6px;}
        .import-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg-2);border:1px solid var(--line);border-radius:6px;cursor:pointer;transition:var(--transition);}
        .import-item:hover{border-color:var(--brass-dim);}
        .import-check{accent-color:var(--brass);}
        .import-num{font-family:var(--mono);font-weight:700;color:var(--brass);font-size:12px;flex:0 0 auto;}
        .import-preview{font-family:var(--mono);font-size:11px;color:var(--text-mid);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

        /* 顶部栏 */
        #topbar{
            height:48px;flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:0 16px;
            background:var(--bg-1);border-bottom:1px solid var(--line);
        }
        #brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--text-hi);}
        #brand .dot{width:8px;height:8px;border-radius:50%;background:var(--brass);}
        #filepath{font-family:var(--mono);font-size:12.5px;color:var(--text-mid);border-left:1px solid var(--line);padding-left:14px;}
        #status{margin-left:auto;font-size:12px;color:var(--text-lo);display:flex;align-items:center;gap:8px;}
        #status .pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok);animation:pulse 2s infinite;}
        .btn{
            background:var(--bg-2);color:var(--text-mid);border:1px solid var(--line);
            font-weight:600;font-size:12.5px;padding:6px 13px;border-radius:var(--radius);
            cursor:pointer;font-family:var(--sans);white-space:nowrap;
            transition:var(--transition);
        }
        .btn:hover:not(:disabled){color:var(--brass);border-color:var(--brass-dim);background:var(--bg-1);}
        .btn.primary{background:var(--brass);color:#1a1508;border:none;box-shadow:0 0 12px var(--brass-glow);}
        .btn.primary:hover:not(:disabled){filter:brightness(1.08);box-shadow:0 0 16px var(--brass-glow);}
        .btn.success:hover:not(:disabled){color:var(--ok);border-color:var(--ok);}
        .btn.danger:hover:not(:disabled){color:var(--err);border-color:var(--err);}
        .btn.active{border-color:var(--ok);color:var(--ok);background:rgba(95,185,135,.1);}
        .btn:disabled{opacity:.35;cursor:default;}
        #editor-mode-select{
            background:var(--bg-2);color:var(--text-mid);border:1px solid var(--line);
            font-weight:600;font-size:12.5px;padding:6px 10px;border-radius:6px;
            cursor:pointer;font-family:var(--sans);
        }

        /* 主体布局 */
        #main{flex:1;display:flex;min-height:0;}
        #sidebar{
            width:260px;flex:0 0 auto;background:var(--bg-1);
            border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
            position:relative;
        }
        /* 文件树隐藏: 折叠侧边栏, 编辑器自动占满 */
        #main.sidebar-hidden #sidebar{ display:none; }
        /* 抽拉板: 折叠后左侧长条, 点击重新展开 */
        #sidebar-drawer{
            display:none;
            flex:0 0 auto;
            width:22px;
            background:var(--bg-1);
            border-right:1px solid var(--line);
            color:var(--text-lo);
            font-size:14px;
            cursor:pointer;
            align-items:center;
            justify-content:center;
            user-select:none;
            transition:var(--transition);
        }
        #sidebar-drawer:hover{color:var(--brass);background:var(--bg-2);}
        #main.sidebar-hidden #sidebar-drawer{ display:flex; }
        /* 文件树宽度拖条 */
        #sidebar-resizer{
            position:absolute;top:0;right:-3px;width:6px;height:100%;
            cursor:col-resize;z-index:30;
        }
        #sidebar-resizer:hover{ background:var(--brass-glow); }
        #sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 6px;}
        #sidebar-header h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-lo);margin:0;}
        .sidebar-toggle{background:none;border:none;color:var(--text-lo);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px;line-height:1;transition:var(--transition);}
        .sidebar-toggle:hover{color:var(--text-hi);background:var(--bg-2);}
        #tree{flex:1;overflow-y:auto;padding:0 8px 8px;}
        .tree-item{
            display:flex;align-items:center;justify-content:space-between;
            padding:5px 6px 5px 8px;border-radius:6px;font-size:13px;color:var(--text-mid);cursor:pointer;
            transition:var(--transition);
        }
        .tree-item:hover{background:var(--bg-2);color:var(--text-hi);}
        .tree-item.active{background:rgba(212,162,74,.12);color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass-glow);}
        .tree-item .icon{width:14px;text-align:center;font-size:11px;flex:0 0 auto;}
        .tree-label{flex:1;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
        .tree-actions{display:none;gap:2px;flex:0 0 auto;}
        .tree-item:hover .tree-actions{display:flex;}
        .tree-action-btn{background:none;border:none;color:var(--text-lo);cursor:pointer;font-size:12px;padding:3px 6px;border-radius:4px;line-height:1.4;transition:var(--transition);}
        .tree-action-btn:hover{color:var(--brass);background:var(--bg-1);}
        .tree-children{padding-left:14px;}
        .tree-root{font-weight:600;letter-spacing:.5px;border-bottom:1px solid var(--line);margin-bottom:4px;}
        .tree-root .tree-label{color:var(--text-hi);}
        .tree-root .tree-label b{font-size:11px;letter-spacing:1px;}
        #presence{padding:10px 14px;border-top:1px solid var(--line);}
        #presence h3{margin:0 0 8px;}
        .user-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg-2);border:1px solid var(--line);color:var(--text-mid);font-size:11.5px;padding:4px 8px;border-radius:12px;margin:0 6px 6px 0;transition:var(--transition);}
        .user-chip:hover{border-color:var(--brass-dim);color:var(--text-hi);}
        .user-chip .swatch{width:7px;height:7px;border-radius:50%;}

        /* 编辑区域 */
        #editor-wrap{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;}
        #empty-state{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-lo);font-size:13px;flex-direction:column;gap:8px;}
        #editor-host{flex:1;min-height:0;display:none;background:#1e2228;flex-direction:column;}
        #editor-frame{display:flex;flex:1;min-height:0;}
        #gutter{flex:0 0 auto;width:46px;background:#1a1e24;color:var(--text-lo);font-family:var(--mono);font-size:13.5px;line-height:1.6;text-align:right;padding:14px 8px 14px 0;overflow:hidden;user-select:none;white-space:pre;}
        #code{flex:1;resize:none;border:none;outline:none;background:transparent;color:var(--text-hi);font-family:var(--mono);font-size:13.5px;line-height:1.6;padding:14px 16px;tab-size:4;white-space:pre;overflow:auto;}
        #monaco-editor{flex:1;min-height:0;display:none;}

        /* ===== 编辑器标签页 ===== */
        #editor-tabs-wrap{
            flex:0 0 auto;
            display:none;
            background:var(--bg-2);
            border-bottom:1px solid var(--line);
            overflow-x:auto;
            overflow-y:hidden;
        }
        #editor-tabs-wrap::-webkit-scrollbar{height:4px;}
        #editor-tabs{display:flex;align-items:stretch;min-width:100%;}
        .etab{
            display:flex;align-items:center;gap:6px;
            padding:6px 10px 6px 12px;
            font-size:12.5px;
            font-family:var(--mono);
            color:var(--text-mid);
            border-right:1px solid var(--line);
            background:var(--bg-1);
            cursor:pointer;
            user-select:none;
            white-space:nowrap;
            position:relative;
            transition:background .12s;
        }
        .etab:hover{background:var(--bg-2);color:var(--text-hi);}
        .etab.active{background:#1e2228;color:var(--text-hi);box-shadow:inset 0 -2px 0 var(--brass);}
        .etab.dragging{opacity:.4;}
        .etab.drag-over-left{box-shadow:inset 2px 0 0 var(--brass);}
        .etab-name{max-width:160px;overflow:hidden;text-overflow:ellipsis;}
        .etab-dot{width:7px;height:7px;border-radius:50%;background:var(--brass);opacity:0;transition:opacity .12s;flex:0 0 auto;}
        .etab-dot.show{opacity:1;}
        .etab-close{width:16px;height:16px;line-height:14px;text-align:center;border-radius:4px;color:var(--text-lo);font-size:14px;flex:0 0 auto;}
        .etab-close:hover{background:rgba(248,81,73,.25);color:#fff;}
        .etab-spacer{flex:1 1 auto;min-width:24px;}

        /* ===== 底部合并面板(Dock) ===== */
        #bottom-dock{
            flex:0 0 auto;
            display:none;
            flex-direction:column;
            border-top:2px solid var(--line);
            background:var(--bg-1);
            height:280px;
            min-height:100px;
            overflow:hidden;
            position:relative;
        }
        #bottom-dock.open{display:flex;}
        #dock-resizer{
            position:absolute;
            top:-3px;
            left:0;
            right:0;
            height:6px;
            cursor:ns-resize;
            z-index:10;
        }
        .dock-tabs{
            flex:0 0 auto;
            display:flex;
            align-items:center;
            gap:0;
            border-bottom:1px solid var(--line);
            background:var(--bg-2);
            padding:0 4px;
        }
        /* 浮动模式: 标签栏整体可拖拽,按钮保持指针光标 */
        #bottom-dock.floating .dock-tabs{cursor:move;}
        #bottom-dock.floating .dock-tabs button{cursor:pointer;}
        .dock-tab{
            background:none;
            border:none;
            border-bottom:2px solid transparent;
            color:var(--text-lo);
            cursor:pointer;
            padding:8px 18px;
            font-size:12.5px;
            font-family:var(--mono);
            transition:all .15s;
        }
        .dock-tab:hover{color:var(--text-mid);}
        .dock-tab.active{
            color:var(--text-hi);
            border-bottom-color:var(--brass);
            background:var(--bg-1);
        }
        .dock-tab .badge{
            display:inline-block;
            margin-left:6px;
            font-size:10px;
            padding:1px 6px;
            border-radius:8px;
            background:var(--bg-0);
            color:var(--text-lo);
        }
        .dock-tab .badge.ac{background:rgba(95,185,135,.2);color:var(--ok);}
        .dock-tab .badge.wa{background:rgba(224,133,133,.2);color:var(--err);}
        .dock-close{
            margin-left:auto;
            background:none;
            border:none;
            color:var(--text-lo);
            cursor:pointer;
            font-size:16px;
            padding:4px 10px;
            border-radius:4px;
            transition:var(--transition);
        }
        .dock-close:hover{color:#fff;background:rgba(248,81,73,.25);}
        .dock-pane{
            flex:1;
            display:none;
            flex-direction:column;
            overflow:hidden;
        }
        .dock-pane.active{display:flex;}

        /* ===== 浮动/常驻 双模式 (单窗口) ===== */
        /* 浮动模式: dock 变为可拖拽的独立浮动窗口 */
        #bottom-dock.floating{
            position:absolute;
            bottom:20px; left:20px;
            width:560px;
            height:340px;
            min-width:340px;
            min-height:200px;
            z-index:50;
            overflow:hidden;
            resize:both;
            border:1px solid var(--brass-dim);
            border-radius:12px;
            box-shadow:var(--shadow-lg);
        }
        /* 常驻模式: 占据布局空间(沿用默认 flex:0 0 auto) */
        #bottom-dock.permanent{ border-top:2px solid var(--brass); }
        /* 最小化(常驻模式收起为仅标签栏) */
        #bottom-dock.minimized{ height:auto !important; }
        #bottom-dock.minimized .dock-pane{ display:none !important; }
        #bottom-dock.minimized #dock-resizer{ display:none; }
        /* 浮动模式隐藏高度拖条(改用 resize:both) */
        #bottom-dock.floating #dock-resizer{ display:none; }
        /* 拖拽手柄: 仅浮动模式可见 */
        .dock-grip{
            display:none;
            cursor:move;
            color:var(--text-lo);
            padding:0 8px 0 8px;
            font-size:14px;
            user-select:none;
            align-self:center;
        }
        #bottom-dock.floating .dock-grip{ display:inline-block; }
        #bottom-dock.floating .dock-grip:hover{ color:var(--text-hi); }
        /* 模式切换按钮 */
        .dock-pin{
            margin-left:auto;
            background:none;border:none;color:var(--text-lo);cursor:pointer;
            font-size:13px;padding:4px 8px;border-radius:4px;line-height:1;
        }
        .dock-pin:hover{color:var(--text-hi);background:var(--bg-1);}
        .dock-pin.active{color:var(--brass);}
        .dock-close{margin-left:0;}
        /* 内容容器 */
        #console-content, #cph-content{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;}

        /* ---- Console 面板 ---- */
        #console-header{
            flex:0 0 auto;
            display:flex;
            align-items:center;
            gap:10px;
            padding:6px 14px;
            border-bottom:1px solid var(--line);
            background:var(--bg-1);
        }
        .panel-title{font-size:12px;color:var(--text-mid);font-family:var(--mono);}
        #console-output{
            flex:1;
            overflow-y:auto;
            padding:10px 14px;
            font-family:var(--mono);
            font-size:12.5px;
            color:#d7dbe0;
            white-space:pre-wrap;
            word-break:break-word;
        }
        #console-input-area{
            flex:0 0 auto;
            padding:8px 14px;
            border-top:1px solid var(--line);
            background:var(--bg-1);
        }
        #console-input{
            width:100%;
            background:var(--bg-2);
            border:1px solid var(--line);
            color:var(--text-hi);
            font-family:var(--mono);
            font-size:13px;
            resize:vertical;
            padding:6px 8px;
            border-radius:4px;
            min-height:60px;
        }
        #console-input-buttons{
            display:flex;
            gap:6px;
            margin-top:6px;
            justify-content:flex-end;
        }

        /* ---- 评测结果徽章 ---- */
        .v-ac{background:rgba(95,185,135,.15);color:var(--ok);border:1px solid rgba(95,185,135,.4);}
        .v-wa{background:rgba(248,81,73,.12);color:var(--err);border:1px solid rgba(248,81,73,.4);}
        .v-ce{background:rgba(212,162,74,.15);color:var(--brass);border:1px solid var(--brass-glow);}
        .v-re{background:rgba(248,81,73,.12);color:var(--err);border:1px solid rgba(248,81,73,.4);}
        .v-tle{background:rgba(212,162,74,.15);color:var(--brass);border:1px solid var(--brass-glow);}
        .v-pending{background:rgba(255,255,255,.05);color:var(--text-lo);border:1px solid var(--line);}

        /* ---- CPH 测试点面板 ---- */
        #cph-toolbar{
            flex:0 0 auto;
            display:flex;
            align-items:center;
            gap:8px;
            padding:6px 14px;
            border-bottom:1px solid var(--line);
            background:var(--bg-1);
        }
        #cph-verdict{font-size:13px;font-weight:700;padding:2px 10px;border-radius:3px;font-family:var(--mono);}
        #cph-summary{font-size:12px;color:var(--text-lo);margin-left:4px;}
        #cph-list{
            flex:1;
            overflow-y:auto;
            padding:8px 10px;
        }
        .tc-row{
            display:grid;
            grid-template-columns:36px 1fr 1fr 70px 64px 60px;
            gap:6px;
            align-items:start;
            padding:6px 8px;
            margin-bottom:4px;
            border:1px solid var(--line);
            border-radius:5px;
            background:var(--bg-0);
        }
        .tc-row .tc-num{
            font-size:12px;
            font-weight:700;
            color:var(--text-lo);
            text-align:center;
            padding-top:4px;
        }
        .tc-row .tc-io{
            display:flex;
            flex-direction:column;
            gap:2px;
        }
        .tc-row .tc-io label{
            font-size:9.5px;
            color:var(--text-lo);
            text-transform:uppercase;
            letter-spacing:.04em;
        }
        .tc-row textarea{
            background:var(--bg-2);
            border:1px solid var(--line);
            border-radius:3px;
            color:var(--text-mid);

        .tc-row .tc-verdict{

            padding:4px 0;
            border-radius:3px;

        .tc-row .tc-time{
            font-size:11px;

        /* ---- 控制台状态徽章 ---- */
        #console-status{padding:2px 10px;border-radius:10px;font-size:11px;font-weight:600;}
        .cs-idle{background:rgba(255,255,255,.06);color:var(--text-lo);}

        /* ---- fre / TT 开关 active 状态 ---- */
        #btn-fre.active{border-color:var(--brass);color:var(--brass);background:rgba(212,162,74,.12);}
        #btn-tt.active{border-color:var(--info);color:var(--info);background:rgba(88,166,255,.12);}
    </style>
</head>
<body>

    <div id="main">
        <div id="sidebar">

                <!-- 控制台面板 -->

    <input type="file" id="upload-input" multiple style="display:none">
    <input type="file" id="upload-zip-input" accept=".zip" style="display:none">
    <div id="toast-container"></div>

    <script src="/static/socket.io.min.js"></script>
    <script>
        // ===================== 全局变量 =====================
        const USER_COLORS = ["#d4a24a","#5fb987","#6ea8d4","#c67ac9","#d47a7a","#7ac6c1"];
        function colorFor(name){ let h=0; for(const ch of name) h=(h*31+ch.charCodeAt(0))%USER_COLORS.length; return USER_COLORS[h]; }
        let username = localStorage.getItem('cpp26-username') || '匿名';
        if(!localStorage.getItem('cpp26-username')){
            showPrompt('你的名字（协作者可见）:', '匿名').then(n => {
                if(n && n.trim()){
                    username = n.trim();
                    localStorage.setItem('cpp26-username', username);
                    statusText.textContent = `在线（${username}）`;
                }
            });
        }
        const socket = io({ transports: ["websocket", "polling"] });
        let currentFile = null;
        let applyingRemote = false;
        let dirty = false;
        let openTabs = [];       // 打开的标签页列表
        let dirtySet = new Set(); // 有未保存修改的文件集合
        let dragPath = null;      // 标签页拖拽中的源文件路径
        let saveTimer = null;
        let selectedFolder = "";
        let selectedFolderElement = null;
        let expandedFolders = new Set();
        let currentEditorType = localStorage.getItem('editor-mode') || 'textarea';
        let monacoEditor = null;
        let monacoLoaded = false;
        let fileContentCache = {};
        let freEnabled = false;
        let ttActive = false;
        let ttUser = '';
        let lastContent = '';  // 用于操作化编辑同步
        let lspChangeTimer = null;  // clangd 实时诊断的防抖

        const JUDGEABLE_EXTS = ['c','cpp','cc','cxx','py'];
        const extOf = p => p.includes('.') ? p.split('.').pop().toLowerCase() : '';
        // 扩展名 -> Monaco 语言 (覆盖 VSCode 原生支持的类型, 触发内置 IntelliSense)
        const LANG_MAP = {
            'cpp':'cpp','cc':'cpp','cxx':'cpp','hpp':'cpp','h':'cpp','hh':'cpp',
            'c':'c',
            'py':'python','pyw':'python',
            'js':'javascript','mjs':'javascript','cjs':'javascript','jsx':'javascript',
            'ts':'typescript','tsx':'typescript',
            'json':'json','jsonc':'json',
            'html':'html','htm':'html','xhtml':'html',
            'css':'css','scss':'scss','less':'less',
            'xml':'xml','svg':'xml',
            'md':'markdown','markdown':'markdown',
            'yaml':'yaml','yml':'yaml',
            'sh':'shell','bash':'shell',
            'sql':'sql',
            'java':'java',
            'go':'go',
            'rust':'rust','rs':'rust',
            'php':'php',
            'rb':'ruby',
            'lua':'lua',
            'ini':'ini','conf':'ini',
            'bat':'bat','cmd':'bat',
            'txt':'plaintext',
        };
        const langForExt = (ext) => LANG_MAP[ext] || 'plaintext';

        // DOM 元素
        const statusText = document.getElementById('status-text');
        const filepathEl = document.getElementById('filepath');
        const treeEl = document.getElementById('tree');
        const sidebarEl = document.getElementById('sidebar');
        const mainEl = document.getElementById('main');
        const sidebarResizer = document.getElementById('sidebar-resizer');
        const btnToggleSidebar = document.getElementById('btn-toggle-sidebar');
        const sidebarDrawer = document.getElementById('sidebar-drawer');
        const presenceList = document.getElementById('presence-list');
        const emptyState = document.getElementById('empty-state');
        const editorHost = document.getElementById('editor-host');
        const editorFrame = document.getElementById('editor-frame');
        const monacoContainer = document.getElementById('monaco-editor');
        const codeEl = document.getElementById('code');
        const gutterEl = document.getElementById('gutter');
        const judgePanel = document.getElementById('pane-cph');
        const judgeVerdict = document.getElementById('cph-verdict');
        const judgeSummary = document.getElementById('cph-summary');
        const judgeBody = document.getElementById('cph-list');
        const bottomDock = document.getElementById('bottom-dock');
        const dockResizer = document.getElementById('dock-resizer');
        const dockClose = document.getElementById('dock-close');
        const dockPin = document.getElementById('dock-pin');
        const dockGrip = document.getElementById('dock-grip');
        const consolePanel = document.getElementById('pane-console');
        const consoleStatus = document.getElementById('console-status');
        const consoleOutput = document.getElementById('console-output');
        const consoleInput = document.getElementById('console-input');
        const consoleStop = document.getElementById('console-stop');
        const btnRunInConsole = document.getElementById('btn-run-in-console');
        const btnSendInput = document.getElementById('btn-send-input');
        const btnClearInput = document.getElementById('btn-clear-input');
        const btnPanel = document.getElementById('btn-panel');
        const btnFre = document.getElementById('btn-fre');
        const btnExport = document.getElementById('btn-export');
        const btnBackup = document.getElementById('btn-backup');
        const btnUpload = document.getElementById('btn-upload');
        const btnTT = document.getElementById('btn-tt');
        const btnAddProblem = document.getElementById('btn-add-problem');
        const uploadInput = document.getElementById('upload-input');
        const uploadZipInput = document.getElementById('upload-zip-input');
        const editorModeSelect = document.getElementById('editor-mode-select');
        const toastContainer = document.getElementById('toast-container');
        const cphBadge = document.getElementById('cph-badge');
        const cphRunAll = document.getElementById('cph-run-all');
        const cphAdd = document.getElementById('cph-add');
        const cphSaveAll = document.getElementById('cph-save-all');
        const cphZip = document.getElementById('cph-zip');
        let cphTestCases = []; // CPH 测试点缓存
        let activeTab = 'console';
        // Dock 模式: floating(浮动覆盖,可关闭) / permanent(常驻布局,可最小化)
        let dockMode = localStorage.getItem('dock-mode') || 'floating';

        // ===================== 文件树(侧边栏) 隐藏 + 宽度拖条 =====================
        let sidebarVisible = localStorage.getItem('sidebar-visible') !== 'false';
        function applySidebarVisible(){
            mainEl.classList.toggle('sidebar-hidden', !sidebarVisible);
            btnToggleSidebar.title = sidebarVisible ? '隐藏文件树' : '显示文件树';
        }
        btnToggleSidebar.addEventListener('click', ()=>{
            sidebarVisible = !sidebarVisible;
            localStorage.setItem('sidebar-visible', sidebarVisible ? 'true' : 'false');
            applySidebarVisible();
            if(sidebarVisible && monacoEditor){
                setTimeout(()=>{ if(monacoEditor) monacoEditor.layout(); }, 50);
            }
        });
        sidebarDrawer.addEventListener('click', ()=>{
            sidebarVisible = true;
            localStorage.setItem('sidebar-visible', 'true');
            applySidebarVisible();
            if(monacoEditor){
                setTimeout(()=>{ if(monacoEditor) monacoEditor.layout(); }, 50);
            }
        });
        // 恢复上次宽度
        const savedSidebarWidth = parseInt(localStorage.getItem('sidebar-width'), 10);
        if(savedSidebarWidth && savedSidebarWidth >= 160 && savedSidebarWidth <= 800){
            sidebarEl.style.width = savedSidebarWidth + 'px';
        }
        // 拖拽调整宽度
        let sidebarResizing = false;
        sidebarResizer.addEventListener('mousedown', (e)=>{
            e.preventDefault();
            sidebarResizing = true;
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
        });
        document.addEventListener('mousemove', (e)=>{
            if(!sidebarResizing) return;
            const w = Math.max(160, Math.min(800, e.clientX));
            sidebarEl.style.width = w + 'px';
        });
        document.addEventListener('mouseup', ()=>{
            if(!sidebarResizing) return;
            sidebarResizing = false;
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            localStorage.setItem('sidebar-width', parseInt(sidebarEl.style.width, 10));
            if(monacoEditor){ monacoEditor.layout(); }
        });
        applySidebarVisible();

        // ===================== 工具函数 =====================
        function normalizeContent(content){ return content.replace(/\r\n/g, '\n').replace(/\r/g, '\n'); }
        function escapeHtml(s){ return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

        // ---- 操作化编辑同步:计算 diff / 应用 op ----
        function computeDiff(oldStr, newStr){
            let start = 0;
            const minLen = Math.min(oldStr.length, newStr.length);
            while (start < minLen && oldStr[start] === newStr[start]) start++;
            let endOld = oldStr.length, endNew = newStr.length;
            while (endOld > start && endNew > start && oldStr[endOld-1] === newStr[endNew-1]){
                endOld--; endNew--;
            }
            return { start: start, end: endOld, text: newStr.substring(start, endNew) };
        }
        function applyOp(content, op){
            return content.substring(0, op.start) + op.text + content.substring(op.end);
        }
        function adjustCursor(pos, op){
            if (pos <= op.start) return pos;
            if (pos >= op.end) return pos + op.text.length - (op.end - op.start);
            return op.start + op.text.length;
        }
        function showToast(message, type='info', duration=3000){
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span class="toast-msg">${escapeHtml(message)}</span><button class="toast-close">×</button>`;
            toast.querySelector('.toast-close').addEventListener('click', ()=>toast.remove());
            toastContainer.appendChild(toast);
            setTimeout(()=>{ if(toast.parentNode) toast.remove(); }, duration);
        }
        function showConfirm(message, onConfirm, onCancel){
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal">
                    <h3>确认操作</h3>
                    <p>${escapeHtml(message)}</p>
                    <div class="modal-buttons">
                        <button class="btn" id="modal-cancel">取消</button>
                        <button class="btn danger" id="modal-ok">确定</button>
                    </div>
                </div>`;
            document.body.appendChild(overlay);
            overlay.querySelector('#modal-cancel').addEventListener('click', ()=>{ overlay.remove(); onCancel && onCancel(); });
            overlay.querySelector('#modal-ok').addEventListener('click', ()=>{ overlay.remove(); onConfirm && onConfirm(); });
        }
        function showPrompt(message, defaultValue=''){
            return new Promise((resolve)=>{
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.innerHTML = `
                    <div class="modal">
                        <h3>输入</h3>
                        <p>${escapeHtml(message)}</p>
                        <input type="text" class="modal-input" id="modal-prompt-input" />
                        <div class="modal-buttons">
                            <button class="btn" id="modal-prompt-cancel">取消</button>
                            <button class="btn primary" id="modal-prompt-ok">确定</button>
                        </div>
                    </div>`;
                document.body.appendChild(overlay);
                const input = overlay.querySelector('#modal-prompt-input');
                input.value = defaultValue;
                const close = (val)=>{ overlay.remove(); resolve(val); };
                input.addEventListener('keydown', (e)=>{
                    if(e.key === 'Enter') close(input.value.trim());
                    else if(e.key === 'Escape') close(null);
                });
                overlay.querySelector('#modal-prompt-cancel').addEventListener('click', ()=>close(null));
                overlay.querySelector('#modal-prompt-ok').addEventListener('click', ()=>close(input.value.trim()));
                setTimeout(()=>{ input.focus(); input.select(); }, 0);
            });
        }

        // ===================== Socket 事件 =====================
        socket.on('connect', ()=>{ statusText.textContent = `在线（${username}）`; });
        socket.on('disconnect', ()=>{ statusText.textContent = '断开连接'; });
        socket.on('connect_error', ()=>{ statusText.textContent = '连接失败'; });
        socket.on('lsp_diagnostics', (data)=>{
            if(!monacoEditor || data.path !== currentFile) return;
            const model = monacoEditor.getModel();
            if(!model) return;
            const sevMap = { 1: monaco.MarkerSeverity.Error, 2: monaco.MarkerSeverity.Warning, 3: monaco.MarkerSeverity.Info, 4: monaco.MarkerSeverity.Hint };
            const markers = (data.diagnostics || []).map(d => {
                const s = d.range && d.range.start ? d.range.start : { line: 0, character: 0 };
                const e = d.range && d.range.end ? d.range.end : { line: 0, character: 0 };
                return {
                    severity: sevMap[d.severity] ?? monaco.MarkerSeverity.Error,
                    message: d.message || '',
                    startLineNumber: (s.line ?? 0) + 1,
                    startColumn: (s.character ?? 0) + 1,
                    endLineNumber: (e.line ?? 0) + 1,
                    endColumn: (e.character ?? 0) + 1,
                    source: d.source || 'clangd',
                };
            });
            monaco.editor.setModelMarkers(model, 'clangd', markers);
        });
        socket.on('presence', (data)=>{
            if(data.path !== currentFile) return;
            presenceList.innerHTML = '';
            const users = data.users.length ? data.users : [username];
            users.forEach(u=>{
                const chip = document.createElement('span');
                chip.className = 'user-chip';
                chip.innerHTML = `<span class="swatch" style="background:${colorFor(u)}"></span>${u}`;
                presenceList.appendChild(chip);
            });
        });
        socket.on('edit', (data)=>{
            if(data.path !== currentFile || applyingRemote) return;
            applyingRemote = true;
            if(data.op){
                // 操作化同步:应用增量编辑
                if(currentEditorType === 'textarea'){
                    const oldVal = codeEl.value;
                    const newVal = applyOp(oldVal, data.op);
                    const selStart = adjustCursor(codeEl.selectionStart, data.op);
                    const selEnd = adjustCursor(codeEl.selectionEnd, data.op);
                    codeEl.value = newVal;
                    codeEl.setSelectionRange(selStart, selEnd);
                    lastContent = newVal;
                    updateGutter();
                } else if(monacoEditor){
                    const model = monacoEditor.getModel();
                    const startPos = model.getPositionAt(data.op.start);
                    const endPos = model.getPositionAt(data.op.end);
                    model.applyEdits([{
                        range: new monaco.Range(startPos.lineNumber, startPos.column, endPos.lineNumber, endPos.column),
                        text: data.op.text
                    }]);
                    lastContent = monacoEditor.getValue();
                }
            } else if(data.content !== undefined){
                // 向后兼容:整段替换
                setEditorContent(data.content);
                lastContent = normalizeContent(data.content);
            }
            applyingRemote = false;
        });
        socket.on('saved', (data)=>{ dirtySet.delete(data.path); if(data.path === currentFile) dirty = false; updateTabDirty(data.path); });
        socket.on('run_output', (data)=>{ if(data.path !== currentFile) return; appendConsole(data.text); });
        socket.on('run_started', (data)=>{
            if(data.path !== currentFile) return;
            if(!freEnabled) {
                const initialInput = consoleInput.value;
                if(initialInput) {
                    socket.emit('run_input', { text: initialInput, no_newline: true });
                    // 不清空，保留输入方便查看
                }
            } else {
                appendConsole('程序已运行，输出重定向到文件，结束后将读取输出文件内容。\n');
            }
        });
        socket.on('run_exit', async (data)=>{
            if(data.path !== currentFile) return;
            consoleStatus.textContent = `已退出（代码 ${data.code}）`;
            consoleStatus.className = 'cs-exited';
            consoleInput.disabled = true;
            consoleStop.disabled = true;
            btnRunInConsole.disabled = false;
            btnSendInput.disabled = true;
            if(freEnabled) {

                        appendConsole('--- 输出文件内容 ---\n');
                        appendConsole(outData.content || '(空)');
                        appendConsole('\n--- 结束 ---\n');
                    } else {
                        appendConsole('[错误] 无法读取输出文件：' + (outData.error || '文件不存在') + '\n');

            if(data.path !== currentFile) return;
            if(data.case === '__compile__'){
                // 编译错误
                if(data.result && data.result.verdict === 'CE'){
                    judgeVerdict.textContent = 'CE';
                    judgeVerdict.className = 'v-ce';
                    judgeSummary.textContent = '编译错误';
                    showToast('编译错误', 'error');
                }
                return;
            }
            const m = data.case.match(/(\d+)/);
            const num = m ? parseInt(m[1]) : 0;
            const tc = cphTestCases.find(t => t.num === num);
            if(tc){
                tc.verdict = data.result.verdict;
                tc.actual = data.result.actual;
                tc.stderr = data.result.stderr;

        function updateGutter(){
            const lines = codeEl.value.split('\n').length;

            if(op.start !== op.end || op.text.length > 0){
                socket.emit('edit', { path: currentFile, op: op });

        codeEl.addEventListener('keydown', function(e){
            if(e.key === 'Tab' && e.shiftKey){
                // Shift+Tab: 反缩进(必须先判断)
                e.preventDefault();
                const start = this.selectionStart, end = this.selectionEnd;
                const value = this.value;
                const sLine = value.substring(0, start).split('\n').length - 1;
                const eLine = value.substring(0, end).split('\n').length - 1;
                const lines = value.split('\n');
                let newStart = start, newEnd = end;
                for(let i=sLine; i<=eLine; i++){
                    const match = lines[i].match(/^( {1,4}|\t)/);
                    if(match){
                        const removeLen = match[0].length;
                        lines[i] = lines[i].substring(removeLen);
                        if(i === sLine) newStart = Math.max(start - removeLen, value.lastIndexOf('\n', start-1)+1);
                        if(i === eLine) newEnd = Math.max(end - removeLen, value.lastIndexOf('\n', end-1)+1);
                    }
                }
                this.value = lines.join('\n');
                this.selectionStart = newStart; this.selectionEnd = newEnd;
                this.dispatchEvent(new Event('input', {bubbles:true}));
                updateGutter();
            } else if(e.key === 'Tab'){
                // Tab: 增加缩进
                e.preventDefault();
                const start = this.selectionStart, end = this.selectionEnd;
                const value = this.value;
                const sLine = value.substring(0, start).split('\n').length - 1;
                const eLine = value.substring(0, end).split('\n').length - 1;
                if(sLine !== eLine){
                    const lines = value.split('\n');
                    const spaces = '    ';
                    let cursorOffset = 0;
                    for(let i=0; i<lines.length; i++){
                        if(i >= sLine && i <= eLine){
                            lines[i] = spaces + lines[i];
                            cursorOffset += spaces.length;
                        }
                    }
                    this.value = lines.join('\n');
                    this.selectionStart = start + spaces.length;
                    this.selectionEnd = end + cursorOffset;
                } else {
                    const spaces = '    ';
                    this.value = value.substring(0, start) + spaces + value.substring(end);
                    this.selectionStart = this.selectionEnd = start + spaces.length;
                }
                this.dispatchEvent(new Event('input', {bubbles:true}));
                updateGutter();
            } else if(e.key === 'Enter'){
                e.preventDefault();
                const start = this.selectionStart, end = this.selectionEnd;
                const before = this.value.substring(0, start);
                const after = this.value.substring(end);
                const lineStart = before.lastIndexOf('\n') + 1;
                const currentLineText = before.substring(lineStart);
                const indentMatch = currentLineText.match(/^[ \t]*/);
                const indent = indentMatch ? indentMatch[0] : '';
                const trimmedLine = currentLineText.trimEnd();
                const extraIndent = trimmedLine.endsWith('{') ? '    ' : '';
                const newIndent = indent + extraIndent;
                this.value = before + '\n' + newIndent + after;
                this.selectionStart = this.selectionEnd = start + 1 + newIndent.length;
                this.dispatchEvent(new Event('input', {bubbles:true}));
                updateGutter();
            }
        });

                function lspKindToMonaco(k){

                    const map = {
                        1: M.Text, 2: M.Method, 3: M.Function, 4: M.Constructor,
                        5: M.Field, 6: M.Variable, 7: M.Class, 8: M.Interface,
                        9: M.Module, 10: M.Property, 11: M.Unit, 12: M.Value,
                        13: M.Enum, 14: M.Keyword, 15: M.Snippet, 16: M.Color,
                        17: M.File, 18: M.Reference, 19: M.Folder, 20: M.EnumMember,
                        21: M.Constant, 22: M.Struct, 23: M.Event, 24: M.Operator,
                        25: M.TypeParameter
                    };
                    return map[k] || M.Text;
                }
                function convertLspItem(it, model, position){
                    const item = {
                        label: (it.label || '').replace(/^\s+/, ''),
                        kind: lspKindToMonaco(it.kind),
                        sortText: it.sortText || ('1' + (it.label || '')),
                        filterText: it.filterText || it.label || '',
                        detail: it.detail || ''
                    };
                    if (it.documentation){
                        if (typeof it.documentation === 'string') item.documentation = it.documentation;
                        else if (it.documentation.value) item.documentation = { value: it.documentation.value };
                    }
                    let insertText = it.insertText;
                    if (it.textEdit){
                        insertText = it.textEdit.newText;
                        if (it.textEdit.range){
                            item.range = {
                                startLineNumber: it.textEdit.range.start.line + 1,
                                startColumn: it.textEdit.range.start.character + 1,
                                endLineNumber: it.textEdit.range.end.line + 1,
                                endColumn: it.textEdit.range.end.character + 1
                            };
                        }
                    }
                    if (insertText !== undefined && insertText !== null){
                        item.insertText = insertText;
                        if (it.insertTextFormat === 2){
                            item.insertTextRules = monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet;
                        }
                    }
                    if (!item.range) item.range = mkRange(model, position);
                    return item;
                }

                let lspPending = null;
                function requestClangdCompletion(model, position){
                    return new Promise(function(resolve){
                        if (!currentFile) { resolve({ suggestions: [] }); return; }
                        const ext = extOf(currentFile);
                        if (['cpp','cc','cxx','h','hpp','hh','c'].indexOf(ext) < 0) { resolve({ suggestions: [] }); return; }
                        const lineUpTo = model.getLineContent(position.lineNumber).substring(0, position.column - 1);
                        // #include 行交给手写 provider, 避免重复头文件条目
                        if (/^\s*#\s*include\s*[<"]?[^>"]*$/.test(lineUpTo)) { resolve({ suggestions: [] }); return; }
                        const payload = {
                            path: currentFile,
                            text: model.getValue(),
                            line: position.lineNumber - 1,
                            character: position.column - 1
                        };
                        if (lspPending){
                            clearTimeout(lspPending.timer);
                            lspPending.resolve({ suggestions: [] });
                        }
                        const entry = { resolve: resolve, timer: null };
                        lspPending = entry;
                        entry.timer = setTimeout(function(){
                            lspPending = null;
                            let done = false;
                            const finish = function(items){ if (!done){ done = true; resolve({ suggestions: items }); } };
                            try {
                                socket.emit('lsp_completion', payload, function(resp){
                                    const raw = (resp && resp.items) ? resp.items : [];
                                    finish(raw.map(function(it){ return convertLspItem(it, model, position); }));
                                });
                            } catch(e){ finish([]); }
                            setTimeout(function(){ finish([]); }, 1200);
                        }, 50);
                    });

        function renderTree(items, container){
            items.forEach(item=>{

                row.dataset.path = item.path;
                row.dataset.type = item.type;
                const label = document.createElement('span');
                label.className = 'tree-label';
                const isExpanded = expandedFolders.has(item.path);
                if(item.type === 'folder'){
                    label.innerHTML = `<span class="icon">${isExpanded ? '▾' : '▸'}</span>${escapeHtml(item.name)}`;
                } else {
                    label.innerHTML = `<span class="icon">·</span>${escapeHtml(item.name)}`;
                }
                row.appendChild(label);
                const actions = document.createElement('span');
                actions.className = 'tree-actions';
                if(item.type === 'folder'){
                    const newFileBtn = document.createElement('button');
                    newFileBtn.className = 'tree-action-btn'; newFileBtn.textContent = '📄';
                    newFileBtn.title = '新建文件';
                    newFileBtn.addEventListener('click', (e)=>{ e.stopPropagation(); if(selectedFolderElement){selectedFolderElement.classList.remove('active');} selectedFolderElement=row; row.classList.add('active'); selectedFolder=item.path; createItem(false); });
                    const newFolderBtn = document.createElement('button');
                    newFolderBtn.className = 'tree-action-btn'; newFolderBtn.textContent = '📁';
                    newFolderBtn.title = '新建文件夹';
                    newFolderBtn.addEventListener('click', (e)=>{ e.stopPropagation(); if(selectedFolderElement){selectedFolderElement.classList.remove('active');} selectedFolderElement=row; row.classList.add('active'); selectedFolder=item.path; createItem(true); });
                    actions.appendChild(newFileBtn); actions.appendChild(newFolderBtn);
                }
                const renameBtn = document.createElement('button');
                renameBtn.className = 'tree-action-btn'; renameBtn.textContent = '✎';
                renameBtn.addEventListener('click', (e)=>{ e.stopPropagation(); renameItem(item); });
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'tree-action-btn'; deleteBtn.textContent = '🗑';
                deleteBtn.addEventListener('click', (e)=>{ e.stopPropagation(); deleteItem(item); });
                actions.appendChild(renameBtn); actions.appendChild(deleteBtn);
                row.appendChild(actions);
                if(item.type === 'folder'){
                    const childWrap = document.createElement('div');
                    childWrap.className = 'tree-children';
                    childWrap.style.display = isExpanded ? 'block' : 'none';
                    renderTree(item.children, childWrap);
                    label.addEventListener('click', (e)=>{
                        e.stopPropagation();
                        const expanded = expandedFolders.has(item.path);
                        if(expanded){ expandedFolders.delete(item.path); childWrap.style.display='none'; label.querySelector('.icon').textContent='▸'; }
                        else{ expandedFolders.add(item.path); childWrap.style.display='block'; label.querySelector('.icon').textContent='▾'; }
                        if(selectedFolderElement) selectedFolderElement.classList.remove('active');
                        row.classList.add('active');
                        selectedFolderElement = row;
                        selectedFolder = item.path;
                    });
                    container.appendChild(row); container.appendChild(childWrap);

                    container.appendChild(row);
                }
            });

        function renderEditorTabs(){
            const bar = document.getElementById('editor-tabs');
            const wrap = document.getElementById('editor-tabs-wrap');
            bar.innerHTML = '';
            openTabs.forEach((p) => {
                const tab = document.createElement('div');
                tab.className = 'etab' + (p === currentFile ? ' active' : '');
                tab.draggable = true;
                tab.dataset.path = p;
                tab.title = p;
                const name = document.createElement('span');
                name.className = 'etab-name';
                name.textContent = p.split('/').pop();
                const dot = document.createElement('span');
                dot.className = 'etab-dot' + (dirtySet.has(p) ? ' show' : '');
                const close = document.createElement('span');
                close.className = 'etab-close';
                close.textContent = '×';
                close.title = '关闭';
                tab.appendChild(name);
                tab.appendChild(dot);
                tab.appendChild(close);
                tab.addEventListener('click', ()=>{ if(p !== currentFile) switchEditorTab(p); });
                close.addEventListener('click', (e)=>{ e.stopPropagation(); closeEditorTab(p); });
                tab.addEventListener('dragstart', (e)=>{
                    e.dataTransfer.setData('text/plain', p);
                    e.dataTransfer.effectAllowed = 'move';
                    dragPath = p;
                    tab.classList.add('dragging');
                });
                tab.addEventListener('dragend', ()=>{
                    dragPath = null;
                    tab.classList.remove('dragging');
                    document.querySelectorAll('#editor-tabs .etab').forEach(t=>t.classList.remove('drag-over-left'));
                });
                tab.addEventListener('dragover', (e)=>{
                    e.preventDefault();
                    e.stopPropagation();
                    e.dataTransfer.dropEffect = 'move';
                    document.querySelectorAll('#editor-tabs .etab').forEach(t=>t.classList.remove('drag-over-left'));
                    tab.classList.add('drag-over-left');
                });
                tab.addEventListener('dragleave', ()=>{ tab.classList.remove('drag-over-left'); });
                tab.addEventListener('drop', (e)=>{
                    e.preventDefault();
                    e.stopPropagation();
                    document.querySelectorAll('#editor-tabs .etab').forEach(t=>t.classList.remove('drag-over-left'));
                    const from = e.dataTransfer.getData('text/plain') || dragPath;
                    if(from && from !== p){
                        const fromIdx = openTabs.indexOf(from);
                        if(fromIdx !== -1){
                            openTabs.splice(fromIdx, 1);
                            const toIdx = openTabs.indexOf(p);
                            openTabs.splice(toIdx, 0, from);
                        }
                    }
                    renderEditorTabs();
                });
                bar.appendChild(tab);
            });
            const spacer = document.createElement('div');
            spacer.className = 'etab-spacer';
            spacer.addEventListener('dragover', (e)=>{ e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
            spacer.addEventListener('drop', (e)=>{
                e.preventDefault();
                const from = e.dataTransfer.getData('text/plain') || dragPath;
                if(from){
                    const fromIdx = openTabs.indexOf(from);
                    if(fromIdx !== -1){ openTabs.splice(fromIdx, 1); openTabs.push(from); }
                }
                renderEditorTabs();
            });
            bar.appendChild(spacer);
            wrap.style.display = openTabs.length ? 'flex' : 'none';
        }

                showConfirm('文件「' + path.split('/').pop() + '」有未保存的修改，保存并关闭吗？', async ()=>{

        function doCloseTab(path){
            const idx = openTabs.indexOf(path);
            if(idx === -1) return;
            openTabs.splice(idx, 1);
            dirtySet.delete(path);
            delete fileContentCache[path];
            if(path === currentFile){
                socket.emit('leave', { path });
                socket.emit('run_stop', {});
                const next = openTabs[Math.min(idx, openTabs.length - 1)];
                if(next){
                    activateFile(next);

                    currentFile = null;

                    filepathEl.textContent = '';
                    btnPanel.disabled = true; btnFre.disabled = true; btnExport.disabled = true; btnBackup.disabled = true;

        // ===================== freopen 切换 =====================
        // 共享: 在 main 的 { 后插入 freopen, 在 return 0; 前插入 fclose
        function applyFreopen(content, baseName) {
            const mainMatch = content.match(/(int\s+main\s*\([^)]*\)\s*)\{/);
            if (!mainMatch) return null;
            const bracePos = mainMatch.index + mainMatch[0].length;
            const freBlock = '\n    freopen("' + baseName + '.in", "r", stdin);\n' +
                             '    freopen("' + baseName + '.out", "w", stdout);\n';
            let result = content.slice(0, bracePos) + freBlock + content.slice(bracePos);
            // 查找最后一个独占一行的 return 0; (属于 main), \n 后仅空白再 return 0;
            const matches = [...result.matchAll(/\n([ \t]*)return\s+0\s*;/g)];
            if (matches.length > 0) {
                const m = matches[matches.length - 1];
                const indent = m[1];
                const fcloseBlock = '\n' + indent + 'fclose(stdin);\n' + indent + 'fclose(stdout);';
                result = result.slice(0, m.index) + fcloseBlock + result.slice(m.index);
            } else {
                // 没有 return 0; — 在 main 闭合 } 前插入
                const lastBrace = result.lastIndexOf('}');
                if (lastBrace !== -1) {
                    result = result.slice(0, lastBrace) + '    fclose(stdin);\n    fclose(stdout);\n' + result.slice(lastBrace);
                }
            }
            return result;
        }
        // 共享: 移除所有 freopen/fclose 行
        function removeFreopen(content, baseName) {
            const lines = content.split('\n');
            const filtered = lines.filter(line => {
                const s = line.trim();
                if (s.startsWith('freopen("' + baseName + '.in"')) return false;
                if (s.startsWith('freopen("' + baseName + '.out"')) return false;
                if (s === 'fclose(stdin);' || s === 'fclose(stdout);') return false;
                return true;
            });
            return filtered.join('\n').replace(/\n{3,}/g, '\n\n');
        }
        function toggleFre() {
            if(!currentFile) return;
            const oldContent = getEditorContent();
            const fileName = currentFile.split('/').pop();
            const baseName = fileName.replace(/\.[^.]+$/, '');
            let newContent = oldContent;
            if (freEnabled) {
                // 禁用:移除所有 freopen 和 fclose 行
                newContent = removeFreopen(oldContent, baseName);
                freEnabled = false;
                btnFre.textContent = 'fre OFF';
                btnFre.classList.remove('active');
                showToast('已禁用 freopen', 'info');
            } else {
                const hasFre = newContent.includes('freopen("' + baseName + '.in"');
                if (!hasFre) {
                    const result = applyFreopen(newContent, baseName);
                    if (result === null) {
                        showToast('未找到 main 函数,无法插入 freopen', 'error');
                        return;
                    }
                    newContent = result;
                }
                freEnabled = true;
                btnFre.textContent = 'fre ON';
                btnFre.classList.add('active');
                showToast('已启用 freopen,输入输出文件为 ' + baseName + '.in/.out', 'success');
            }
            setEditorContent(newContent);
            if (currentFile) {
                const op = computeDiff(oldContent, newContent);
                if (op.start !== op.end || op.text.length > 0) {
                    socket.emit('edit', { path: currentFile, op: op });
                }
                markDirty(currentFile);
                btnBackup.disabled = false;
                clearTimeout(saveTimer);
                saveTimer = setTimeout(() => saveFile(true), 1500);
            }
        }
        btnFre.addEventListener('click', toggleFre);

        // 浮动模式: dock 变为单个可拖拽浮动窗口(标签切换 控制台/评测)
        // 常驻模式: dock 占据底部布局空间
        function applyDockMode(){
            const isPermanent = dockMode === 'permanent';
            bottomDock.classList.toggle('floating', !isPermanent);
            bottomDock.classList.toggle('permanent', isPermanent);
            dockPin.textContent = isPermanent ? '📌' : '📍';
            dockPin.classList.toggle('active', isPermanent);
            dockPin.title = isPermanent ? '常驻模式 - 点击切换为浮动' : '浮动模式 - 点击切换为常驻';
            dockClose.title = isPermanent ? '最小化(常驻模式不会完全关闭)' : '关闭面板';
            if(isPermanent){
                bottomDock.classList.add('open');
            }
        }
        function setDockMode(mode){
            dockMode = mode;
            localStorage.setItem('dock-mode', mode);
            bottomDock.classList.remove('minimized');
            // 清除拖动产生的内联定位样式,回到默认布局
            bottomDock.style.left = '';
            bottomDock.style.top = '';
            bottomDock.style.right = '';
            bottomDock.style.bottom = '';
            bottomDock.style.width = '';
            applyDockMode();
        }
        function isPanelOpen(){
            return bottomDock.classList.contains('open') && !bottomDock.classList.contains('minimized');
        }
        function openDock(tab){
            bottomDock.classList.add('open');
            bottomDock.classList.remove('minimized');
            switchTab(tab);
        }
        function closeDock(){
            if(dockMode === 'permanent'){
                // 常驻模式: 仅最小化为标签栏,不彻底关闭
                bottomDock.classList.add('minimized');
            } else {
                // 浮动模式: 关闭浮动窗口
                socket.emit('run_stop', {});
                bottomDock.classList.remove('open');
            }
        }
        function switchTab(tab){
            activeTab = tab;
            document.querySelectorAll('.dock-tab').forEach(t => {
                t.classList.toggle('active', t.dataset.tab === tab);
            });
            document.querySelectorAll('.dock-pane').forEach(p => {
                p.classList.toggle('active', p.id === 'pane-' + tab);
            });
        }
        document.querySelectorAll('.dock-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                if(bottomDock.classList.contains('minimized')){
                    bottomDock.classList.remove('minimized');
                }
                switchTab(tab.dataset.tab);
            });
        });
        dockPin.addEventListener('click', () => setDockMode(dockMode === 'floating' ? 'permanent' : 'floating'));
        dockClose.addEventListener('click', closeDock);
        // 浮动模式拖拽: 整个标签栏均可拖拽(点击按钮/标签时除外)
        const dockTabsBar = document.querySelector('.dock-tabs');
        dockTabsBar.addEventListener('mousedown', (e) => {
            if(dockMode !== 'floating') return;
            // 点到按钮(标签/pin/close)则不拖拽
            if(e.target.closest('button')) return;
            const rect = bottomDock.getBoundingClientRect();
            // dock 是 absolute, left/top 相对 offsetParent(#editor-wrap), 必须换算
            const parent = bottomDock.offsetParent || document.body;
            const parentRect = parent.getBoundingClientRect();
            const offsetX = e.clientX - rect.left;
            const offsetY = e.clientY - rect.top;
            // 切换为相对 offsetParent 的 left/top 定位(保持视觉位置不变)
            bottomDock.style.right = 'auto';
            bottomDock.style.bottom = 'auto';
            bottomDock.style.left = (rect.left - parentRect.left) + 'px';
            bottomDock.style.top = (rect.top - parentRect.top) + 'px';
            bottomDock.style.width = rect.width + 'px';
            const maxX = parent.clientWidth - 80;
            const maxY = parent.clientHeight - 40;
            function move(ev){
                let nx = ev.clientX - offsetX - parentRect.left;
                let ny = ev.clientY - offsetY - parentRect.top;
                nx = Math.max(0, Math.min(maxX, nx));
                ny = Math.max(0, Math.min(maxY, ny));
                bottomDock.style.left = nx + 'px';
                bottomDock.style.top = ny + 'px';
            }
            function up(){
                document.removeEventListener('mousemove', move);
                document.removeEventListener('mouseup', up);
            }
            document.addEventListener('mousemove', move);
            document.addEventListener('mouseup', up);
            e.preventDefault();
        });
        applyDockMode();

        // Dock 拖拽调整高度

            dockStartH = bottomDock.offsetHeight;
            document.body.style.cursor = 'ns-resize';
            e.preventDefault();
        });
        document.addEventListener('mousemove', (e)=>{
            if(!dockResizing) return;
            const dy = e.clientY - dockStartY;
            const newH = Math.max(100, Math.min(window.innerHeight - 120, dockStartH - dy));
            bottomDock.style.height = newH + 'px';
        });
        document.addEventListener('mouseup', ()=>{
