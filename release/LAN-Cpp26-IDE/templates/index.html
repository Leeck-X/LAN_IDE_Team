                    { label: 'segt', kind: K.Snippet, insertText: 'int tree[4 * MAXN], a[MAXN];\nvoid build(int p, int l, int r) {\n\tif (l == r) { tree[p] = a[l]; return; }\n\tint mid = (l + r) / 2;\n\tbuild(2*p, l, mid);\n\tbuild(2*p+1, mid+1, r);\n\ttree[p] = tree[2*p] + tree[2*p+1];\n}\nvoid update(int p, int l, int r, int x, int v) {\n\tif (l == r) { tree[p] = v; return; }\n\tint mid = (l + r) / 2;\n\tif (x <= mid) update(2*p, l, mid, x, v);\n\telse update(2*p+1, mid+1, r, x, v);\n\ttree[p] = tree[2*p] + tree[2*p+1];\n}\nint query(int p, int l, int r, int ql, int qr) {\n\tif (qr < l || r < ql) return 0;\n\tif (ql <= l && r <= qr) return tree[p];\n\tint mid = (l + r) / 2;\n\treturn query(2*p, l, mid, ql, qr) + query(2*p+1, mid+1, r, ql, qr);\n}', detail: '线段树 (区间求和)', ctx: 'noinclude' },
                    // 图论
                    { label: 'dijkstra', kind: K.Snippet, insertText: 'struct Edge { int to, w; };\nvector<Edge> adj[MAXN];\nlong long dist[MAXN];\nbool vis[MAXN];\nvoid dijkstra(int s, int n) {\n\tmemset(dist, 0x3f, sizeof(dist));\n\tmemset(vis, false, sizeof(vis));\n\tdist[s] = 0;\n\tpriority_queue<pair<long long,int>, vector<pair<long long,int>>, greater<>> pq;\n\tpq.push({0, s});\n\twhile (!pq.empty()) {\n\t\tauto [d, u] = pq.top(); pq.pop();\n\t\tif (vis[u]) continue;\n\t\tvis[u] = true;\n\t\tfor (auto &e : adj[u]) {\n\t\t\tif (dist[u] + e.w < dist[e.to]) {\n\t\t\t\tdist[e.to] = dist[u] + e.w;\n\t\t\t\tpq.push({dist[e.to], e.to});\n\t\t\t}\n\t\t}\n\t}\n}', detail: 'Dijkstra (堆优化)', ctx: 'noinclude' },
                    { label: 'floyd', kind: K.Snippet, insertText: 'long long d[MAXN][MAXN];\nvoid floyd(int n) {\n\tfor (int k = 1; k <= n; k++)\n\t\tfor (int i = 1; i <= n; i++)\n\t\t\tfor (int j = 1; j <= n; j++)\n\t\t\t\tif (d[i][k] + d[k][j] < d[i][j])\n\t\t\t\t\td[i][j] = d[i][k] + d[k][j];\n}\n// 初始化: d[i][i]=0; d[i][j]=INF; 读入边 d[u][v]=w;', detail: 'Floyd 全源最短路', ctx: 'noinclude' },
                    { label: 'topsort', kind: K.Snippet, insertText: 'vector<int> adj[MAXN];\nint in_deg[MAXN];\nbool topsort(int n) {\n\tqueue<int> q;\n\tfor (int i = 1; i <= n; i++) if (in_deg[i] == 0) q.push(i);\n\tint cnt = 0;\n\twhile (!q.empty()) {\n\t\tint u = q.front(); q.pop();\n\t\tcnt++;\n\t\tfor (int v : adj[u]) if (--in_deg[v] == 0) q.push(v);\n\t}\n\treturn cnt == n;\n}', detail: '拓扑排序 (Kahn)', ctx: 'noinclude' },
                    { label: 'kruskal', kind: K.Snippet, insertText: 'struct Edge { int u, v, w; };\nbool cmp(const Edge &a, const Edge &b) { return a.w < b.w; }\nint fa[MAXN];\nint find(int x) { return fa[x] == x ? x : fa[x] = find(fa[x]); }\nlong long kruskal(int n, vector<Edge>& edges) {\n\tsort(edges.begin(), edges.end(), cmp);\n\tfor (int i = 0; i <= n; i++) fa[i] = i;\n\tlong long sum = 0; int cnt = 0;\n\tfor (auto &e : edges) {\n\t\tint fu = find(e.u), fv = find(e.v);\n\t\tif (fu != fv) { fa[fu] = fv; sum += e.w; cnt++; }\n\t\tif (cnt == n - 1) break;\n\t}\n\treturn sum;\n}', detail: 'Kruskal 最小生成树', ctx: 'noinclude' },
                    // 字符串
                    { label: 'kmp', kind: K.Snippet, insertText: 'int nxt[MAXN];\nvoid get_next(const string &p) {\n\tint m = p.size();\n\tnxt[0] = -1;\n\tfor (int i = 0, j = -1; i < m;) {\n\t\tif (j == -1 || p[i] == p[j]) { i++; j++; nxt[i] = j; }\n\t\telse j = nxt[j];\n\t}\n}\nint kmp(const string &s, const string &p) {\n\tget_next(p);\n\tint n = s.size(), m = p.size();\n\tfor (int i = 0, j = 0; i < n;) {\n\t\tif (j == -1 || s[i] == p[j]) { i++; j++; }\n\t\telse j = nxt[j];\n\t\tif (j == m) return i - m;\n\t}\n\treturn -1;\n}', detail: 'KMP 字符串匹配', ctx: 'noinclude' },
                    { label: 'trie', kind: K.Snippet, insertText: 'int ch[MAXN][26], cnt;\nbool is_end[MAXN];\nvoid insert(const string &s) {\n\tint u = 0;\n\tfor (char c : s) {\n\t\tint v = c - \'a\';\n\t\tif (!ch[u][v]) ch[u][v] = ++cnt;\n\t\tu = ch[u][v];\n\t}\n\tis_end[u] = true;\n}\nbool search(const string &s) {\n\tint u = 0;\n\tfor (char c : s) {\n\t\tint v = c - \'a\';\n\t\tif (!ch[u][v]) return false;\n\t\tu = ch[u][v];\n\t}\n\treturn is_end[u];\n}', detail: 'Trie 字典树', ctx: 'noinclude' },
                    { label: 'manacher', kind: K.Snippet, insertText: 'int p[MAXN*2];\nstring manacher(const string &s) {\n\tstring t = "#";\n\tfor (char c : s) { t += c; t += \'#\'; }\n\tint n = t.size(), c = 0, r = 0;\n\tfor (int i = 0; i < n; i++) {\n\t\tp[i] = i < r ? min(p[2*c-i], r-i) : 1;\n\t\twhile (i-p[i] >= 0 && i+p[i] < n && t[i-p[i]] == t[i+p[i]]) p[i]++;\n\t\tif (i+p[i] > r) { c = i; r = i+p[i]; }\n\t}\n\treturn t;\n}', detail: 'Manacher 回文串', ctx: 'noinclude' },
                    // DP 模板
                    { label: 'knapsack01', kind: K.Snippet, insertText: 'int dp[MAXN];\nfor (int i = 0; i < n; i++) {\n\tfor (int j = W; j >= w[i]; j--) {\n\t\tdp[j] = max(dp[j], dp[j - w[i]] + v[i]);\n\t}\n}\n// 答案: dp[W]', detail: '01 背包', ctx: 'noinclude' },
                    { label: 'knapsack_full', kind: K.Snippet, insertText: 'int dp[MAXN];\nfor (int i = 0; i < n; i++) {\n\tfor (int j = w[i]; j <= W; j++) {\n\t\tdp[j] = max(dp[j], dp[j - w[i]] + v[i]);\n\t}\n}\n// 答案: dp[W]', detail: '完全背包', ctx: 'noinclude' },
                    { label: 'lis', kind: K.Snippet, insertText: 'vector<int> dp;\nfor (int i = 0; i < n; i++) {\n\tauto it = lower_bound(dp.begin(), dp.end(), a[i]);\n\tif (it == dp.end()) dp.push_back(a[i]);\n\telse *it = a[i];\n}\n// 答案: dp.size()', detail: 'LIS O(n log n)', ctx: 'noinclude' },
                    { label: 'lcs', kind: K.Snippet, insertText: 'int dp[MAXN][MAXN];\nfor (int i = 1; i <= n; i++) {\n\tfor (int j = 1; j <= m; j++) {\n\t\tif (a[i-1] == b[j-1]) dp[i][j] = dp[i-1][j-1] + 1;\n\t\telse dp[i][j] = max(dp[i-1][j], dp[i][j-1]);\n\t}\n}\n// 答案: dp[n][m]', detail: 'LCS 最长公共子序列', ctx: 'noinclude' },
                    // 调试 / 常用宏
                    { label: 'debug', kind: K.Snippet, insertText: '#define debug(x) cerr << #x << " = " << x << endl', detail: '调试宏', ctx: 'noinclude' },
                    { label: 'rep_macro', kind: K.Snippet, insertText: '#define rep(i, a, b) for (int i = (a); i < (b); i++)\n#define rep1(i, a, b) for (int i = (a); i <= (b); i++)', detail: 'rep 循环宏', ctx: 'noinclude' },
                    { label: 'MAXN', kind: K.Snippet, insertText: 'const int MAXN = ${1:100005};\nconst int INF = 0x3f3f3f3f;', detail: 'MAXN / INF 常量', ctx: 'noinclude' },
                ];
                monaco.languages.registerCompletionItemProvider('cpp', {
                    triggerCharacters: ['#', '<', '.', '>', ':'],
                    provideCompletionItems: function(model, position){
                        const lineContent = model.getLineContent(position.lineNumber);
                        const textBefore = lineContent.substring(0, position.column - 1);
                        const word = model.getWordUntilPosition(position);
                        const prefix = (word.word || '').toLowerCase();

                        // 上下文1: #include <...> → 补头文件名
                        // 补全后自动选中 <> 内的头文件名(整体作为可编辑的 tabstop),
                        // 方便用户直接输入覆盖, 无需手动删除, 行为对标 VS Code。
                        const incMatch = textBefore.match(/#\s*include\s*[<"]([^>"\s]*)$/);
                        if (incMatch) {
                            const openChar = textBefore.charAt(textBefore.length - incMatch[1].length - 1); // '<' 或 '"'
                            const closeChar = openChar === '<' ? '>' : '"';
                            const hdrPrefix = incMatch[1];
                            // 若已闭合(出现 > 或 "), 不再补全, 避免提示
                            if (hdrPrefix === '' && /[>"']\s*$/.test(textBefore)) {
                                return { suggestions: [] };
                            }
                            const startColumn = position.column - hdrPrefix.length;
                            // 光标之后, 到下一个闭合符号(或 行尾/空白)之前的既有文本也一并纳入替换范围,
                            // 这样即使光标停在头文件名中间, 选中补全项也会替换掉整个既有头文件名。
                            const afterCursor = lineContent.substring(position.column - 1);
                            const afterMatch = afterCursor.match(new RegExp('^[^' + closeChar + '\\s]*'));
                            const afterLen = afterMatch ? afterMatch[0].length : 0;
                            const hasCloseBracket = afterCursor.charAt(afterLen) === closeChar;
                            const endColumn = position.column + afterLen;
                            const range = { startLineNumber: position.lineNumber, endLineNumber: position.lineNumber, startColumn: startColumn, endColumn: endColumn };
                            return { suggestions: CPP_HEADERS
                                .filter(h => h.startsWith(hdrPrefix))
                                .map(h => ({
                                    label: h,
                                    kind: K.Module,
                                    // 头文件名整体作为 tabstop ${1:...}, 插入后自动选中,
                                    // 用户可直接输入替换, 未闭合时自动补 closeChar。
                                    insertText: '${1:' + h + '}' + (hasCloseBracket ? '' : closeChar),
                                    insertTextRules: SNIPPET,
                                    range: range,
                                    detail: hasCloseBracket ? 'header' : ('header (auto close ' + closeChar + ')'),
                                    sortText: '0'
                                })) };
                        }

                        // 上下文2: 模板 <...> 内部 → 补类型名
                        const tplMatch = textBefore.match(/(?:vector|map|set|unordered_map|unordered_set|pair|tuple|array|deque|list|stack|queue|priority_queue|bitset|multiset|multimap)\s*<[^<]*$/);
                        if (tplMatch) {
                            const range = mkRange(model, position);
                            return { suggestions: CPP_TYPES.map(t => ({ label: t, kind: K.TypeParameter, insertText: t, range: range, sortText: '0' })) };
                        }

                        // 上下文3: 行首 # 预处理
                        if (/^\s*#/.test(textBefore)) {
                            const hashPrefix = textBefore.replace(/^\s*#/, '');
                            const startColumn = position.column - hashPrefix.length;
                            const range = { startLineNumber: position.lineNumber, endLineNumber: position.lineNumber, startColumn: startColumn, endColumn: position.column };
                            return { suggestions: CPP_PREPROCESS
                                .filter(p => p.label.startsWith(hashPrefix))
                                .map(p => {
                                    const item = Object.assign({}, p, { kind: K.Keyword, range: range, sortText: '0' });
                                    if (p.insertText.indexOf('${') >= 0) item.insertTextRules = SNIPPET;
                                    return item;
                                }) };
                        }

                        // 默认: 关键字 + 代码片段(前缀过滤)
                        const range = mkRange(model, position);
                        // 检测函数定义式模板(main/bfs/dfs 等)前的返回类型关键字, 避免 "int int main" 或 "void void bfs" 重复
                        const beforeCursor = lineContent.substring(0, range.startColumn - 1);
                        const retTypeMatch = beforeCursor.match(/\b(int|signed|void|unsigned|long|short|char|double|float|int32_t|int64_t|size_t|bool|auto)\s+$/);
                        const kwSuggestions = CPP_KEYWORDS
                            .filter(k => !prefix || k.toLowerCase().startsWith(prefix))
                            .map(k => ({ label: k, kind: K.Keyword, insertText: k, range: range, sortText: '2' }));
                        const snSuggestions = CPP_SNIPPETS
                            .filter(s => !prefix || (s.label || '').toLowerCase().startsWith(prefix))
                            .map(s => {
                                const item = Object.assign({}, s, { range: range });
                                // 模板缩进统一为 4 空格, 与编辑器 insertSpaces 设置一致(避免混入 tab)
                                if (typeof item.insertText === 'string' && item.insertText.indexOf('\t') >= 0){
                                    item.insertText = item.insertText.replace(/\t/g, '    ');
                                }
                                // 函数定义式模板(funcDef): 若前面已写返回类型关键字, 扩展 range 覆盖前缀
                                // 避免 "int int main"/"void void bfs"/"void void dfs" 等重复
                                if (s.funcDef && retTypeMatch) {
                                    item.range = {
                                        startLineNumber: position.lineNumber,
                                        endLineNumber: position.lineNumber,
                                        startColumn: range.startColumn - retTypeMatch[0].length,
                                        endColumn: range.endColumn
                                    };
                                    // 保留默认 label 过滤, 让模板名仍可触发; range 已扩展以覆盖返回类型前缀
                                }
                                if (s.insertText && s.insertText.indexOf('${') >= 0) item.insertTextRules = SNIPPET;
                                if (s.sortText) item.sortText = s.sortText;
                                if (s.documentation) item.documentation = s.documentation;
                                if (s.commitCharacters) item.commitCharacters = s.commitCharacters;
                                return item;
                            });
                        // 已声明的变量/函数名 — 优先级最高, 方便复用
                        const declaredNames = extractDeclaredNames(model.getValue());
                        const varSuggestions = [];
                        for (const [name, kind] of declaredNames){
                            if (prefix && !name.toLowerCase().startsWith(prefix)) continue;
                            // 排除正在输入的当前光标处的同名声明自身
                            varSuggestions.push({
                                label: name,
                                kind: kind === 'func' ? K.Function : K.Variable,
                                insertText: name,
                                range: range,
                                sortText: '0',
                                detail: kind === 'func' ? '当前文件函数' : '当前文件变量'
                            });
                        }
                        return { suggestions: varSuggestions.concat(snSuggestions).concat(kwSuggestions) };
                    }
                });
                // ===================== clangd LSP 语义补全 =====================
                function lspKindToMonaco(k){

                    return new Promise(function(resolve){

                        if (/^\s*#\s*include\s*[<"]?[^>"]*$/.test(lineUpTo)) { resolve({ suggestions: [] }); return; }
                        const payload = {
                            path: currentFile,
                            text: model.getValue(),
                            line: position.lineNumber - 1,
                            character: position.column - 1
                        };
                        if (lspPending){
                            clearTimeout(lspPending.timer);
                            lspPending.resolve({ suggestions: [] });
                        }
                        const entry = { resolve: resolve, timer: null };
                        lspPending = entry;

                            let done = false;
                            const finish = function(items){ if (!done){ done = true; resolve({ suggestions: items }); } };

        function renderTree(items, container){

                row.appendChild(label);
                const actions = document.createElement('span');

                    newFileBtn.title = '新建文件';
                    newFileBtn.addEventListener('click', (e)=>{ e.stopPropagation(); if(selectedFolderElement){selectedFolderElement.classList.remove('active');} selectedFolderElement=row; row.classList.add('active'); selectedFolder=item.path; createItem(false); });
                    const newFolderBtn = document.createElement('button');
                    newFolderBtn.className = 'tree-action-btn'; newFolderBtn.textContent = '📁';
                    newFolderBtn.title = '新建文件夹';
                    newFolderBtn.addEventListener('click', (e)=>{ e.stopPropagation(); if(selectedFolderElement){selectedFolderElement.classList.remove('active');} selectedFolderElement=row; row.classList.add('active'); selectedFolder=item.path; createItem(true); });
                    actions.appendChild(newFileBtn); actions.appendChild(newFolderBtn);
                }
                const renameBtn = document.createElement('button');
                renameBtn.className = 'tree-action-btn'; renameBtn.textContent = '✎';

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'tree-action-btn'; deleteBtn.textContent = '🗑';
                deleteBtn.addEventListener('click', (e)=>{ e.stopPropagation(); deleteItem(item); });
                actions.appendChild(renameBtn); actions.appendChild(deleteBtn);
                if(item.type === 'file'){
                    // 云盘式下载: 任意文件(文本/二进制)都可直接从文件树下载
                    const dlBtn = document.createElement('button');
                    dlBtn.className = 'tree-action-btn'; dlBtn.textContent = '⬇';
                    dlBtn.title = '下载';
                    dlBtn.addEventListener('click', (e)=>{ e.stopPropagation(); downloadFile(item.path); });
                    actions.insertBefore(dlBtn, renameBtn);
                    // 分屏打开: 在右侧打开该文件
                    const splitBtn = document.createElement('button');

                    splitBtn.addEventListener('click', (e)=>{ e.stopPropagation(); toggleSplit(item.path); });
                    actions.insertBefore(splitBtn, renameBtn);

                row.appendChild(actions);
                if(item.type === 'folder'){
                    const childWrap = document.createElement('div');
                    childWrap.className = 'tree-children';
                    childWrap.style.display = isExpanded ? 'block' : 'none';
                    renderTree(item.children, childWrap);
                    label.addEventListener('click', (e)=>{
                        e.stopPropagation();
                        const expanded = expandedFolders.has(item.path);
                        if(expanded){ expandedFolders.delete(item.path); childWrap.style.display='none'; label.querySelector('.icon').textContent='▸'; }
                        else{ expandedFolders.add(item.path); childWrap.style.display='block'; label.querySelector('.icon').textContent='▾'; }
                        if(selectedFolderElement) selectedFolderElement.classList.remove('active');
                        row.classList.add('active');
                        selectedFolderElement = row;
                        selectedFolder = item.path;
                    });
                    container.appendChild(row); container.appendChild(childWrap);
                } else {
                    label.addEventListener('click', ()=>openFile(item.path, row));
                    container.appendChild(row);
                }
            });
        }
        // ===================== 编辑器标签页 =====================
        function updateTabDirty(path){
            document.querySelectorAll('#editor-tabs .etab').forEach(tab=>{
                if(tab.dataset.path === path){
                    const dot = tab.querySelector('.etab-dot');
                    if(dot) dot.classList.toggle('show', dirtySet.has(path));
                }
            });
        }
        function markDirty(path){
            if(!path) return;
            dirty = true;
            dirtySet.add(path);
            updateTabDirty(path);
        }
        function renderEditorTabs(){
            const bar = document.getElementById('editor-tabs');
            const wrap = document.getElementById('editor-tabs-wrap');
            bar.innerHTML = '';
            openTabs.forEach((p) => {
                const tab = document.createElement('div');
                tab.className = 'etab' + (p === currentFile ? ' active' : '');
                tab.draggable = true;
                tab.dataset.path = p;
                tab.title = p;
                const name = document.createElement('span');
                name.className = 'etab-name';
                name.textContent = p.split('/').pop();
                const dot = document.createElement('span');
                dot.className = 'etab-dot' + (dirtySet.has(p) ? ' show' : '');
                const close = document.createElement('span');
                close.className = 'etab-close';
                close.textContent = '×';
                close.title = '关闭';
                tab.appendChild(name);
                tab.appendChild(dot);
                tab.appendChild(close);
                tab.addEventListener('click', ()=>{ if(p !== currentFile) switchEditorTab(p); });
                close.addEventListener('click', (e)=>{ e.stopPropagation(); closeEditorTab(p); });
                tab.addEventListener('dragstart', (e)=>{
                    e.dataTransfer.setData('text/plain', p);
                    e.dataTransfer.effectAllowed = 'move';
                    dragPath = p;
                    tab.classList.add('dragging');
                });
                tab.addEventListener('dragend', ()=>{
                    dragPath = null;
                    tab.classList.remove('dragging');
                    document.querySelectorAll('#editor-tabs .etab').forEach(t=>t.classList.remove('drag-over-left'));
                });
                tab.addEventListener('dragover', (e)=>{
                    e.preventDefault();
                    e.stopPropagation();
                    e.dataTransfer.dropEffect = 'move';
                    document.querySelectorAll('#editor-tabs .etab').forEach(t=>t.classList.remove('drag-over-left'));
                    tab.classList.add('drag-over-left');
                });
                tab.addEventListener('dragleave', ()=>{ tab.classList.remove('drag-over-left'); });
                tab.addEventListener('drop', (e)=>{
                    e.preventDefault();
                    e.stopPropagation();
                    document.querySelectorAll('#editor-tabs .etab').forEach(t=>t.classList.remove('drag-over-left'));
                    const from = e.dataTransfer.getData('text/plain') || dragPath;
                    if(from && from !== p){
                        const fromIdx = openTabs.indexOf(from);
                        if(fromIdx !== -1){
                            openTabs.splice(fromIdx, 1);
                            const toIdx = openTabs.indexOf(p);
                            openTabs.splice(toIdx, 0, from);
                        }
                    }
                    renderEditorTabs();
                });
                bar.appendChild(tab);
            });
            const spacer = document.createElement('div');
            spacer.className = 'etab-spacer';
            spacer.addEventListener('dragover', (e)=>{ e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
            spacer.addEventListener('drop', (e)=>{
                e.preventDefault();
                const from = e.dataTransfer.getData('text/plain') || dragPath;
                if(from){
                    const fromIdx = openTabs.indexOf(from);
                    if(fromIdx !== -1){ openTabs.splice(fromIdx, 1); openTabs.push(from); }
                }
                renderEditorTabs();
            });
            bar.appendChild(spacer);
            updateTabWrapVisibility();
        }
        function switchEditorTab(path){

                fileContentCache[currentFile] = getEditorContent();

                // 最后一小段编辑只存在于本地缓存而在下次 join 时被权威内容覆盖

        function activateFile(path){

            for(const sid in remoteWidgets){ if(monacoEditor){ try { monacoEditor.removeContentWidget(remoteWidgets[sid]); } catch(e){} } }
            remoteWidgets = {};
            remoteCursors = {};

            document.querySelectorAll('.tree-item').forEach(el=>el.classList.toggle('active', el.dataset.path === path));

            if(['c','cpp','cc','cxx','h','hpp','hh'].includes(extOf(path))){

            if(monacoEditor){
                monaco.editor.setModelLanguage(monacoEditor.getModel(), langForExt(extOf(path)));
            }
            if(currentEditorType === 'textarea') updateGutter();

            consoleInput.disabled = true;
            consoleStop.disabled = true;
            btnRunInConsole.disabled = false;

            socket.emit('join', { path: path, username: username, device: deviceLabel() });

        async function openFile(path, rowEl){
            document.querySelectorAll('.tree-item').forEach(el=>el.classList.remove('active'));
            if(rowEl) rowEl.classList.add('active');
            if(currentFile && currentFile !== path){
                clearTimeout(saveTimer);
                fileContentCache[currentFile] = getEditorContent();
                if(dirtySet.has(currentFile)) persistFile(currentFile);
                socket.emit('leave', { path: currentFile });
                socket.emit('run_stop', {});
            }
            if(!openTabs.includes(path)) openTabs.push(path);
            if(fileContentCache[path] === undefined){
                const res = await fetch('/api/file?path=' + encodeURIComponent(path));
                const data = await res.json();
                if(data.error){
                    openTabs.splice(openTabs.indexOf(path), 1);
                    renderEditorTabs();
                    showToast('打开失败: ' + data.error, 'error');
                    return;
                }
                if(data.binary){
                    openTabs.splice(openTabs.indexOf(path), 1);
                    renderEditorTabs();
                    setEditorContent('');
                    editorHost.style.display = 'none';
                    emptyState.style.display = 'flex';
                    renderBinaryPreview(path, data);
                    btnPanel.disabled = true; btnFre.disabled = true; btnExport.disabled = true; btnBackup.disabled = true;
                    btnRunInConsole.disabled = true;
                    return;
                }
                fileContentCache[path] = data.content || '';
            }
            activateFile(path);
        }

        // ===================== 二进制文件预览与下载 =====================
        function rawFileUrl(path, download){
            return '/api/file/raw?path=' + encodeURIComponent(path) + (download ? '&download=1' : '');
        }
        function formatSize(bytes){
            if(bytes === null || bytes === undefined) return '';
            if(bytes < 1024) return bytes + ' B';
            if(bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            if(bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
            return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
        }
        function downloadFile(path){
            const a = document.createElement('a');
            a.href = rawFileUrl(path, true);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast('开始下载: ' + path.split('/').pop(), 'info', 2000);
        }
        // 按类型渲染预览: 图片/视频/音频/PDF 在线预览, 其余(exe/zip等)提示无法预览并提供下载
        function renderBinaryPreview(path, data){
            const mime = data.mime || 'application/octet-stream';
            const name = path.split('/').pop();
            const ext = name.includes('.') ? name.split('.').pop().toUpperCase() : '';
            filepathEl.textContent = path;
            const rawUrl = rawFileUrl(path, false);
            const kind = mime.startsWith('image/') ? 'image'
                : mime.startsWith('video/') ? 'video'
                : mime.startsWith('audio/') ? 'audio'
                : (mime === 'application/pdf') ? 'pdf' : 'other';
            let bodyHtml = '';
            if(kind === 'image'){
                // 独立图片预览: 画布容器 + 悬浮工具条(+/-缩放/重置), 交互逻辑见 initImageCanvas
                bodyHtml = `<div class="img-canvas" id="img-canvas">
                        <img src="${rawUrl}" alt="${escapeHtml(name)}" id="img-canvas-el" draggable="false" />
                    </div>
                    <div class="img-canvas-toolbar" id="img-canvas-toolbar">
                        <button id="img-zoom-out" title="缩小">−</button>
                        <span class="zoom-pct" id="img-zoom-pct">100%</span>
                        <button id="img-zoom-in" title="放大">＋</button>
                        <span class="sep"></span>
                        <button id="img-zoom-reset" title="重置视图 (适应窗口)">⟲</button>
                    </div>`;
            } else if(kind === 'video'){
                // 独立视频预览默认静音播放(不影响 Markdown 文档内嵌视频), 用户可手动开启音量
                bodyHtml = `<video src="${rawUrl}" controls preload="metadata" muted></video>`;
            } else if(kind === 'audio'){
                bodyHtml = `<audio src="${rawUrl}" controls preload="metadata"></audio>`;
            } else if(kind === 'pdf'){
                bodyHtml = `<iframe src="${rawUrl}" title="pdf-preview"></iframe>`;
            } else {
                bodyHtml = `<div class="binary-unsupported">
                    <span class="big-icon">📦</span>
                    <div class="hint-title">「${escapeHtml(ext || 'BIN')}」类型文件暂不支持在线预览</div>
                    <div>可下载到本地后使用对应软件打开</div>
                </div>`;
            }
            const metaBits = [mime];
            if(data.size !== null && data.size !== undefined) metaBits.push(formatSize(data.size));
            emptyState.innerHTML = `
                <div class="binary-preview">
                    <div class="binary-toolbar">
                        <span class="binary-name" title="${escapeHtml(path)}">${escapeHtml(name)}</span>
                        <span class="binary-meta">${metaBits.join(' · ')}</span>
                        <span class="spacer"></span>
                        <button class="btn" id="btn-binary-open">新窗口打开</button>
                        <button class="btn primary" id="btn-binary-download">下载</button>
                    </div>
                    <div class="binary-body" style="${kind === 'image' ? 'position:relative;padding:0;' : ''}">${bodyHtml}</div>
                </div>`;
            // 图片加载失败(损坏/误判类型)时回退为提示
            const img = emptyState.querySelector('#img-canvas-el');
            if(img){
                img.addEventListener('error', ()=>{
                    const canvas = emptyState.querySelector('#img-canvas');
                    const toolbar = emptyState.querySelector('#img-canvas-toolbar');
                    if(toolbar) toolbar.remove();
                    if(canvas) canvas.outerHTML = `<div class="binary-unsupported"><span class="big-icon">⚠</span><div class="hint-title">预览加载失败, 文件可能已损坏</div><div>可尝试下载后查看</div></div>`;
                });
                initImageCanvas(img);
            }
            document.getElementById('btn-binary-download').addEventListener('click', ()=>downloadFile(path));
            document.getElementById('btn-binary-open').addEventListener('click', ()=>window.open(rawUrl, '_blank'));
        }

        // ===================== 独立图片预览: PS 式画布缩放/平移 =====================
        // 仅作用于独立打开的图片文件预览窗口, 不影响 Markdown 文档内嵌图片。
        const IMG_ZOOM_MIN = 0.05;   // 缩放下限 5%
        const IMG_ZOOM_MAX = 16;     // 缩放上限 1600%
        const IMG_ZOOM_STEP = 1.25;  // 按钮/滚轮单次缩放倍率
        function initImageCanvas(img){
            const canvas = document.getElementById('img-canvas');
            const toolbar = document.getElementById('img-canvas-toolbar');
            if(!canvas || !toolbar) return;
            const zoomPctEl = document.getElementById('img-zoom-pct');
            const btnIn = document.getElementById('img-zoom-in');
            const btnOut = document.getElementById('img-zoom-out');
            const btnReset = document.getElementById('img-zoom-reset');

            let fitScale = 1;      // 适应容器的基准缩放(相对图片原始像素)
            let scale = 1;         // 当前实际缩放(相对图片原始像素)
            let tx = 0, ty = 0;    // 图片左上角相对画布左上角的平移量(px)
            let naturalW = 0, naturalH = 0;
            let ready = false;

            let userAdjusted = false; // 用户是否已手动缩放/平移过, 用于决定容器 resize 时是否强制重新适配

            function clampScale(s){ return Math.min(IMG_ZOOM_MAX, Math.max(IMG_ZOOM_MIN, s)); }

            function computeFit(){
                const cw = canvas.clientWidth, ch = canvas.clientHeight;
                if(!naturalW || !naturalH || !cw || !ch){ fitScale = 1; return; }
                // 图片尺寸大于或小于容器时都自动缩放到合适大小, 保持原始比例, 不溢出面板
                fitScale = Math.min(cw / naturalW, ch / naturalH, 1) || 1;
                // 极小图片也允许放大铺满(但不超过 100%), 避免小图缩成一个点; 如需保持原样可去掉此行
                if(fitScale <= 0) fitScale = 1;
            }

            function applyTransform(){
                img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
                if(zoomPctEl) zoomPctEl.textContent = Math.round(scale * 100) + '%';
                if(btnIn) btnIn.disabled = scale >= IMG_ZOOM_MAX - 1e-6;
                if(btnOut) btnOut.disabled = scale <= IMG_ZOOM_MIN + 1e-6;
            }

            function resetView(){
                computeFit();
                scale = clampScale(fitScale);
                const cw = canvas.clientWidth, ch = canvas.clientHeight;
                // 居中显示
                tx = (cw - naturalW * scale) / 2;
                ty = (ch - naturalH * scale) / 2;
                userAdjusted = false;
                applyTransform();
            }

            // 以指定的画布坐标(锚点)为中心缩放, 保持锚点在视觉上位置不变(类似 PS/浏览器 Ctrl+滚轮)
            function zoomAt(anchorX, anchorY, nextScale){
                nextScale = clampScale(nextScale);
                if(nextScale === scale) return;
                const ratio = nextScale / scale;
                tx = anchorX - (anchorX - tx) * ratio;
                ty = anchorY - (anchorY - ty) * ratio;
                scale = nextScale;
                applyTransform();
            }

            function zoomAtCenter(nextScale){
                const cw = canvas.clientWidth, ch = canvas.clientHeight;
                zoomAt(cw / 2, ch / 2, nextScale);
            }

            // ---- 初始化: 图片自适应容器 ----
            function onImgReady(){
                naturalW = img.naturalWidth || img.width || 1;
                naturalH = img.naturalHeight || img.height || 1;
                ready = true;
                resetView();
            }
            if(img.complete && img.naturalWidth){ onImgReady(); }
            else { img.addEventListener('load', onImgReady, { once: true }); }

            // 容器尺寸变化(如侧栏展开/收起、窗口 resize)时, 若用户尚未手动缩放/平移过, 保持"适应窗口"状态实时重算;
            // 用户已手动调整过视图后不再自动改变缩放, 避免打断操作。
            const ro = new ResizeObserver(() => { if(ready && !userAdjusted) resetView(); });
            ro.observe(canvas);
            // 预览切换文件时该 DOM 会被整体替换, 无需手动 disconnect, 但保险起见挂到元素上供 GC 前清理
            canvas._imgCanvasCleanup = () => ro.disconnect();

            // ---- 按钮缩放 ----
            btnIn.addEventListener('click', () => { if(ready){ userAdjusted = true; zoomAtCenter(scale * IMG_ZOOM_STEP); } });
            btnOut.addEventListener('click', () => { if(ready){ userAdjusted = true; zoomAtCenter(scale / IMG_ZOOM_STEP); } });
            btnReset.addEventListener('click', () => { if(ready) resetView(); });

            // ---- 鼠标滚轮缩放: 以光标位置为中心 ----
            canvas.addEventListener('wheel', (e) => {
                if(!ready) return;
                e.preventDefault();
                userAdjusted = true;
                const rect = canvas.getBoundingClientRect();
                const anchorX = e.clientX - rect.left;
                const anchorY = e.clientY - rect.top;
                const factor = Math.pow(IMG_ZOOM_STEP, -e.deltaY / 100);
                zoomAt(anchorX, anchorY, scale * factor);
            }, { passive: false });

            // ---- 长按拖动平移(使用 Pointer Events + setPointerCapture, 避免全局 window 监听器随预览重开而累积泄漏) ----
            let panning = false, panStartX = 0, panStartY = 0, panOrigTx = 0, panOrigTy = 0, activePointerId = null;
            canvas.addEventListener('pointerdown', (e) => {
                if(!ready || e.button !== 0) return;
                panning = true;
                userAdjusted = true;
                activePointerId = e.pointerId;
                panStartX = e.clientX; panStartY = e.clientY;
                panOrigTx = tx; panOrigTy = ty;
                canvas.classList.add('panning');
                canvas.setPointerCapture(e.pointerId);
                e.preventDefault();
            });
            canvas.addEventListener('pointermove', (e) => {
                if(!panning || e.pointerId !== activePointerId) return;
                tx = panOrigTx + (e.clientX - panStartX);
                ty = panOrigTy + (e.clientY - panStartY);
                applyTransform();
            });
            function endPan(e){
                if(!panning || (e && e.pointerId !== activePointerId)) return;
                panning = false;
                canvas.classList.remove('panning');
                if(activePointerId !== null){ try{ canvas.releasePointerCapture(activePointerId); }catch(_e){} }
                activePointerId = null;
            }
            canvas.addEventListener('pointerup', endPan);
            canvas.addEventListener('pointercancel', endPan);
        }

        // ===================== freopen 切换 =====================
        // 共享: 在 main 的 { 后插入 freopen, 在 return 0; 前插入 fclose
        function applyFreopen(content, baseName) {
            // 识别任意形式的 main 函数: int main(){ / signed main(){ / void main(){ / main(){ 等
            const mainMatch = content.match(/\bmain\s*\([^)]*\)\s*\{/);
            if (!mainMatch) return null;
            const bracePos = mainMatch.index + mainMatch[0].length;
            const freBlock = '\n    freopen("' + baseName + '.in", "r", stdin);\n' +
                             '    freopen("' + baseName + '.out", "w", stdout);\n';
            let result = content.slice(0, bracePos) + freBlock + content.slice(bracePos);
            // 查找最后一个独占一行的 return 0; (属于 main), \n 后仅空白再 return 0;
            const matches = [...result.matchAll(/\n([ \t]*)return\s+0\s*;/g)];
            if (matches.length > 0) {
                const m = matches[matches.length - 1];
                const indent = m[1];
                const fcloseBlock = '\n' + indent + 'fclose(stdin);\n' + indent + 'fclose(stdout);';
                result = result.slice(0, m.index) + fcloseBlock + result.slice(m.index);
            } else {
                // 没有 return 0; — 在 main 闭合 } 前插入
                const lastBrace = result.lastIndexOf('}');
                if (lastBrace !== -1) {
                    result = result.slice(0, lastBrace) + '    fclose(stdin);\n    fclose(stdout);\n' + result.slice(lastBrace);
                }
            }
            return result;
        }
        // 共享: 移除所有 freopen/fclose 行
        function removeFreopen(content, baseName) {
            const lines = content.split('\n');
            const filtered = lines.filter(line => {
                const s = line.trim();
                if (s.startsWith('freopen("' + baseName + '.in"')) return false;
                if (s.startsWith('freopen("' + baseName + '.out"')) return false;
                if (s === 'fclose(stdin);' || s === 'fclose(stdout);') return false;
                return true;
            });
            return filtered.join('\n').replace(/\n{3,}/g, '\n\n');
        }
        function toggleFre() {
            if(!currentFile) return;
            const oldContent = getEditorContent();
            const fileName = currentFile.split('/').pop();
            const baseName = fileName.replace(/\.[^.]+$/, '');
            let newContent = oldContent;
            if (freEnabled) {
                // 禁用:移除所有 freopen 和 fclose 行
                newContent = removeFreopen(oldContent, baseName);
                freEnabled = false;
                btnFre.textContent = 'fre OFF';
                btnFre.classList.remove('active');
                showToast('已禁用 freopen', 'info');
            } else {
                const hasFre = newContent.includes('freopen("' + baseName + '.in"');
                if (!hasFre) {
                    const result = applyFreopen(newContent, baseName);
                    if (result === null) {
                        showToast('未找到 main 函数,无法插入 freopen', 'error');
                        return;
                    }
                    newContent = result;
                }
                freEnabled = true;
                btnFre.textContent = 'fre ON';
                btnFre.classList.add('active');
                showToast('已启用 freopen,输入输出文件为 ' + baseName + '.in/.out', 'success');
            }
            setEditorContent(newContent);
            if (currentFile) {
                const op = computeDiff(oldContent, newContent);
                if (op.start !== op.end || op.text.length > 0) {
                    otApplyLocal(TextOp.fromSplice(op, oldContent.length));
                }
                markDirty(currentFile);
                btnBackup.disabled = false;
                clearTimeout(saveTimer);
                const freSavePath = currentFile;
                saveTimer = setTimeout(() => persistFile(freSavePath), 1500);
            }
        }
        btnFre.addEventListener('click', toggleFre);

        // ===================== 导出 =====================
        function exportFile() {
            if (!currentFile) return;
            let content = getEditorContent();
            const fileName = currentFile.split('/').pop();
            const baseName = fileName.replace(/\.[^.]+$/, '');
            if (!freEnabled) {
                const hasFre = content.includes('freopen("' + baseName + '.in"');
                if (!hasFre) {
                    const result = applyFreopen(content, baseName);
                    if (result !== null) content = result;
                }
            }
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);
            showToast('导出成功', 'success');
        }

        // ===================== 底部 Dock (浮动/常驻 单窗口双模式) =====================
        // 浮动模式: dock 变为单个可拖拽浮动窗口(标签切换 控制台/评测)
        // 常驻模式: dock 占据底部布局空间
        function applyDockMode(){
            const isPermanent = dockMode === 'permanent';
            bottomDock.classList.toggle('floating', !isPermanent);
            bottomDock.classList.toggle('permanent', isPermanent);
            dockPin.textContent = isPermanent ? '📌' : '📍';
            dockPin.classList.toggle('active', isPermanent);
            dockPin.title = isPermanent ? '常驻模式 - 点击切换为浮动' : '浮动模式 - 点击切换为常驻';
            dockClose.title = isPermanent ? '最小化(常驻模式不会完全关闭)' : '关闭面板';
            if(isPermanent){
                bottomDock.classList.add('open');
            }
        }
        function setDockMode(mode){
            dockMode = mode;
            localStorage.setItem('dock-mode', mode);
            bottomDock.classList.remove('minimized');
            // 清除拖动产生的内联定位样式,回到默认布局
            bottomDock.style.left = '';
            bottomDock.style.top = '';
            bottomDock.style.right = '';
            bottomDock.style.bottom = '';
            bottomDock.style.width = '';
            applyDockMode();
        }
        function isPanelOpen(){
            return bottomDock.classList.contains('open') && !bottomDock.classList.contains('minimized');
        }
        function openDock(tab){
            bottomDock.classList.add('open');
            bottomDock.classList.remove('minimized');
            switchTab(tab);
        }
        function closeDock(){
            if(dockMode === 'permanent'){
                // 常驻模式: 仅最小化为标签栏,不彻底关闭
                bottomDock.classList.add('minimized');
            } else {
                // 浮动模式: 关闭浮动窗口
                socket.emit('run_stop', {});
                bottomDock.classList.remove('open');
            }
        }
        function switchTab(tab){
            activeTab = tab;
            document.querySelectorAll('.dock-tab').forEach(t => {
                t.classList.toggle('active', t.dataset.tab === tab);
            });
            document.querySelectorAll('.dock-pane').forEach(p => {
                p.classList.toggle('active', p.id === 'pane-' + tab);
            });
        }
        document.querySelectorAll('.dock-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                if(bottomDock.classList.contains('minimized')){
                    bottomDock.classList.remove('minimized');
                }
                switchTab(tab.dataset.tab);
            });
        });
        dockPin.addEventListener('click', () => setDockMode(dockMode === 'floating' ? 'permanent' : 'floating'));
        dockClose.addEventListener('click', closeDock);
        // 浮动模式拖拽: 整个标签栏均可拖拽(点击按钮/标签时除外)
        const dockTabsBar = document.querySelector('.dock-tabs');
        dockTabsBar.addEventListener('mousedown', (e) => {
            if(dockMode !== 'floating') return;
            // 点到按钮(标签/pin/close)则不拖拽
            if(e.target.closest('button')) return;
            const rect = bottomDock.getBoundingClientRect();
            // dock 是 absolute, left/top 相对 offsetParent(#editor-wrap), 必须换算
            const parent = bottomDock.offsetParent || document.body;
            const parentRect = parent.getBoundingClientRect();
            const offsetX = e.clientX - rect.left;
            const offsetY = e.clientY - rect.top;
            // 切换为相对 offsetParent 的 left/top 定位(保持视觉位置不变)
            bottomDock.style.right = 'auto';
            bottomDock.style.bottom = 'auto';
            bottomDock.style.left = (rect.left - parentRect.left) + 'px';
            bottomDock.style.top = (rect.top - parentRect.top) + 'px';
            bottomDock.style.width = rect.width + 'px';
            const maxX = parent.clientWidth - 80;
            const maxY = parent.clientHeight - 40;
            function move(ev){
                let nx = ev.clientX - offsetX - parentRect.left;
                let ny = ev.clientY - offsetY - parentRect.top;
                nx = Math.max(0, Math.min(maxX, nx));
                ny = Math.max(0, Math.min(maxY, ny));
                bottomDock.style.left = nx + 'px';
                bottomDock.style.top = ny + 'px';
            }
            function up(){
                document.removeEventListener('mousemove', move);
                document.removeEventListener('mouseup', up);
            }
            document.addEventListener('mousemove', move);
            document.addEventListener('mouseup', up);
            e.preventDefault();
        });
        applyDockMode();

        // Dock 拖拽调整高度
        let dockResizing = false, dockStartY = 0, dockStartH = 0;
        dockResizer.addEventListener('mousedown', (e)=>{
            dockResizing = true;
            dockStartY = e.clientY;
            dockStartH = bottomDock.offsetHeight;
            document.body.style.cursor = 'ns-resize';
            e.preventDefault();
        });
        document.addEventListener('mousemove', (e)=>{
            if(!dockResizing) return;
            const dy = e.clientY - dockStartY;
            const newH = Math.max(100, Math.min(window.innerHeight - 120, dockStartH - dy));
            bottomDock.style.height = newH + 'px';
        });
        document.addEventListener('mouseup', ()=>{
            if(dockResizing){ dockResizing = false; document.body.style.cursor = ''; }
        });

        // ===================== 控制台 =====================
        btnPanel.addEventListener('click', () => {
            if(isPanelOpen()){
                // 面板键: 完全隐藏(不残留最小化标签栏)
                socket.emit('run_stop', {});
                bottomDock.classList.remove('open');
                bottomDock.classList.remove('minimized');
            } else {
                openDock(activeTab);
            }
            consoleInput.disabled = false;
            btnRunInConsole.disabled = !currentFile || !JUDGEABLE_EXTS.includes(extOf(currentFile));

            }
        });

        btnRunInConsole.addEventListener('click', () => {
            if (!currentFile) return;
            openDock('console');
            consoleOutput.textContent = '';

        btnSendInput.addEventListener('click', () => {

            // 用户已发送输入，重新进入"等待下一次输出/输入"的判断
            clearTimeout(consoleWaitTimer);
            if(consoleStatus.className === 'cs-waiting'){
                consoleStatus.textContent = '运行中...';
                consoleStatus.className = 'cs-running';
            }
            consoleWaitTimer = setTimeout(()=>{
                if(consoleStatus.className === 'cs-running'){
                    consoleStatus.textContent = '等待输入...';
                    consoleStatus.className = 'cs-waiting';
                }
            }, 800);
        });

        btnClearInput.addEventListener('click', () => { consoleInput.value = ''; });
        consoleStop.addEventListener('click', () => { clearTimeout(consoleWaitTimer); socket.emit('run_stop', {}); });

        function appendConsole(text){
            const atBottom = consoleOutput.scrollTop + consoleOutput.clientHeight >= consoleOutput.scrollHeight - 4;
            consoleOutput.appendChild(document.createTextNode(text));
            if(atBottom) consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }

        // ===================== 文件操作 =====================
        async function createItem(folder){
            const name = await showPrompt(folder ? '输入文件夹名:' : '输入文件名:', '');
            if(!name) return;
            const path = selectedFolder ? selectedFolder + '/' + name : name;
            let content = '';
            if(!folder && name.indexOf('.') >= 0){
                const ext = name.split('.').pop().toLowerCase();
                if(userTemplates[ext]) content = replaceTemplateVars(userTemplates[ext], name);
            }
            const res = await fetch('/api/create', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({path:path, folder:folder, content:content}) });
            if(res.ok){
                showToast(folder ? '文件夹已创建' : '文件已创建', 'success');
                loadTree();
                if(!folder){
                    const row = document.querySelector(`.tree-item[data-path="${path}"]`);
                    if(row) openFile(path, row);
                }
            }
            else{ const err=await res.json(); showToast(err.error||'创建失败','error'); }
        }
        async function renameItem(item){
            const newName = await showPrompt('重命名为:', item.name);
            if(!newName || newName===item.name) return;
            const parts = item.path.split('/'); parts[parts.length-1]=newName; const newPath=parts.join('/');
            const res = await fetch('/api/rename', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({old:item.path, new:newPath}) });
            // 不在本地直接改 currentFile: 服务器会向旧 room 广播 file_renamed,
            // 统一由该事件完成 leave/join/缓存迁移, 避免本地先改导致广播分支被跳过、协同失效
            if(res.ok){ showToast('重命名成功','success'); loadTree(); }
            else{ const err=await res.json(); showToast(err.error||'重命名失败','error'); }
        }
        async function deleteItem(item){
            showConfirm(`确定要删除 "${item.name}" 吗？`, async ()=>{
                const res = await fetch('/api/delete', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({path:item.path}) });
                if(res.ok){
                    // 清理已删除文件夹的展开状态
                    expandedFolders.delete(item.path);
                    for(const p of [...expandedFolders]){
                        if(p.startsWith(item.path + '/')) expandedFolders.delete(p);
                    }
                    if(selectedFolder===item.path || (selectedFolder && selectedFolder.startsWith(item.path+'/'))){
                        selectedFolder="";
                        if(selectedFolderElement){ selectedFolderElement.classList.remove('active'); selectedFolderElement=null; }
                    }
                    if(currentFile===item.path || (currentFile && currentFile.startsWith(item.path+'/'))){
                        currentFile=null;
                        filepathEl.textContent='未打开文件';
                        emptyState.style.display='flex';
                        editorHost.style.display='none';
                        btnPanel.disabled=true; btnFre.disabled=true; btnExport.disabled=true; btnBackup.disabled=true;
                        closeDock();
                        socket.emit('leave', {path:item.path});
                    }
                    showToast('删除成功','success'); loadTree();
                }else{ const err=await res.json(); showToast(err.error||'删除失败','error'); }
            });
        }

        // ===================== TT 模式 (沉浸做题) =====================
        async function toggleTT() {
            if (ttActive) {
                // 退出 TT 模式
                ttActive = false;
                ttUser = '';
                btnTT.textContent = 'TT';
                btnTT.classList.remove('active');

            btnTT.textContent = 'TT: ' + ttUser;
            btnTT.classList.add('active');
            btnAddProblem.style.display = '';

        async function addProblem() {
            if (!ttActive || !ttUser) return;
            const name = await showPrompt('请输入题名（将创建同名文件夹和 cpp 文件）:');
            if (!name || !name.trim()) return;
            const problem = name.trim();
            const folderPath = ttUser + '/' + problem;
            const filePath = folderPath + '/' + problem + '.cpp';
            const template = '#include<bits/stdc++.h>\nusing namespace std;\nint main(){\n    return 0;\n}\n';
            // 创建题目文件夹
            await fetch('/api/create', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({path:folderPath, folder:true}) });
            // 创建 cpp 文件并写入模板内容
            await fetch('/api/file', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({path:filePath, content:template}) });
            await loadTree();
            // 展开用户文件夹和题目文件夹
            expandedFolders.add('__root__');
            expandPath(ttUser);
            expandPath(folderPath);
            // 找到文件行并打开
            const row = document.querySelector('.tree-item[data-path="' + filePath + '"]');
            openFile(filePath, row);
            showToast('已创建题目: ' + problem, 'success');

        function expandPath(path) {

                const childWrap = row.nextElementSibling;
                if (childWrap) childWrap.style.display = 'block';
                const icon = row.querySelector('.icon');
                if (icon) icon.textContent = '▾';

        btnTT.addEventListener('click', toggleTT);
        btnAddProblem.addEventListener('click', addProblem);

        // ===================== 上传 =====================
        btnUpload.addEventListener('click', ()=>uploadInput.click());
        uploadInput.addEventListener('change', async ()=>{
            for(const file of uploadInput.files){
                const fd = new FormData(); fd.append('file', file);
                await fetch('/api/upload', { method:'POST', body: fd });

        // ===================== zip 测试包导入 =====================
        uploadZipInput.addEventListener('change', async ()=>{
            const file = uploadZipInput.files[0];
            if(!file) return;
            if(!currentFile){
                showToast('请先打开要导入测试点的源文件', 'warning');
                uploadZipInput.value='';
                return;
            }
            const fd = new FormData();
            fd.append('file', file);
            // 后端按 source(当前源文件路径)推导出对应的 {base}_T/ 测试点目录，
            // 之前误传了 dir(所在文件夹)，导致字段名与后端不匹配、导入总是失败。
            fd.append('source', currentFile);
            try{
                const res = await fetch('/api/upload_tests', { method:'POST', body: fd });
                const data = await res.json();
                if(data.ok){
                    showToast(`导入完成: 新增/覆盖 ${data.count} 个文件`, 'success');
                    loadTree();
                    if(currentFile && JUDGEABLE_EXTS.includes(extOf(currentFile))){
                        await loadCPH(currentFile);
                    }
                } else {
                    showToast('导入失败: ' + (data.error || '未知错误'), 'error');
                }
            }catch(e){
                showToast('上传请求失败', 'error');
            }
            uploadZipInput.value='';
        });

        // ===================== CPH 测试点管理 =====================
        let cphLoadSeq = 0;   // 请求序号: 快速切换文件时丢弃旧响应, 防止面板显示错位数据
        async function loadCPH(path){
            if(!path || !JUDGEABLE_EXTS.includes(extOf(path))){
                cphTestCases = [];
                cphRunAll.disabled = true;
                cphAdd.disabled = true;
                cphSaveAll.disabled = true;
                cphZip.disabled = true;
                renderCPH();
                return;
            }
            cphAdd.disabled = false;
            cphSaveAll.disabled = false;
            cphRunAll.disabled = false;
            cphZip.disabled = false;
            const seq = ++cphLoadSeq;
            try{
                const res = await fetch('/api/tests?path=' + encodeURIComponent(path));
                const tests = await res.json();
                if(seq !== cphLoadSeq || path !== currentFile) return;  // 已切换到其他文件, 丢弃
                cphTestCases = tests;
                // 从 name "test N" 中提取编号
                cphTestCases.forEach(tc => {
                    const m = tc.name.match(/(\d+)/);
                    tc.num = m ? parseInt(m[1]) : 0;
                });
                cphTestCases.sort((a,b) => a.num - b.num);
                renderCPH();
            }catch(e){
                if(seq !== cphLoadSeq || path !== currentFile) return;
                cphTestCases = [];
                renderCPH();
            }
        }

        // 从其他文件导入测试点(勾选/全选)
        async function showImportFromFile(){
            if(!currentFile) return;
            const srcName = await showPrompt('输入源文件名（相对 workspace，如 sum.cpp）:', currentFile);
            if(!srcName) return;
            let srcTests = [];
            try{
                const res = await fetch('/api/tests?path=' + encodeURIComponent(srcName));
                srcTests = await res.json();
            }catch(e){}
            if(!srcTests || !srcTests.length){
                showToast('该文件没有测试点', 'warning');
                return;
            }
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal import-modal">
                    <h3>从 ${escapeHtml(srcName)} 导入测试点</h3>
                    <div class="import-list">
                        ${srcTests.map(t => {
                            const num = ((t.name || '').match(/(\d+)/) || ['0'])[0];
                            return `<label class="import-item">
                                <input type="checkbox" class="import-check" data-num="${num}" checked>
                                <span class="import-num">#${num}</span>
                                <span class="import-preview">in: ${escapeHtml((t.input||'').slice(0,24))} · out: ${escapeHtml((t.expected||'').slice(0,24))}</span>
                            </label>`;
                        }).join('')}
                    </div>
                    <div class="modal-buttons">
                        <button class="btn" id="import-cancel">取消</button>
                        <button class="btn primary" id="import-ok">导入选中</button>
                    </div>
                </div>`;
            document.body.appendChild(overlay);
            overlay.querySelector('#import-cancel').addEventListener('click', ()=>overlay.remove());
            overlay.querySelector('#import-ok').addEventListener('click', async ()=>{
                const nums = [...overlay.querySelectorAll('.import-check:checked')].map(c => c.dataset.num);
                overlay.remove();
                if(!nums.length){ showToast('未选择任何测试点', 'warning'); return; }
                try{
                    // 交给后端 /api/test/import: 编号冲突时自动重映射, 不覆盖原测试点
                    const res = await fetch('/api/test/import', {
                        method:'POST',
                        headers:{'Content-Type':'application/json'},
                        body: JSON.stringify({ source: srcName, target: currentFile, nums: nums })
                    });
                    const data = await res.json();
                    if(data.ok){
                        showToast(`导入完成: ${data.count} 个文件（冲突编号已自动重映射）`, 'success');
                        await loadCPH(currentFile);
                    } else {
                        showToast('导入失败: ' + (data.error || '未知错误'), 'error');
                    }
                }catch(e){
                    showToast('导入请求失败', 'error');
                }
            });
        }

        // 更新评测徽章
        function setCphBadge(visible, text, cls){
            cphBadge.style.display = visible ? 'inline-block' : 'none';
            cphBadge.textContent = text;
            cphBadge.className = 'badge' + (cls ? ' ' + cls : '');
        }
        function renderCPH(){
            judgeBody.innerHTML = '';
            // 更新总览
            const results = cphTestCases.filter(tc => tc.verdict);
            const acCount = results.filter(tc => tc.verdict === 'AC').length;
            const totalCount = results.length;
            if(totalCount > 0){
                const allAc = acCount === totalCount && totalCount === cphTestCases.length;
                judgeVerdict.textContent = allAc ? 'AC' : results.some(tc => tc.verdict === 'WA') ? 'WA' :
                    results.some(tc => tc.verdict === 'TLE') ? 'TLE' :
                    results.some(tc => tc.verdict === 'RE') ? 'RE' : '—';
                judgeVerdict.className = 'v-' + judgeVerdict.textContent.toLowerCase();
                judgeSummary.textContent = `${acCount}/${totalCount} passed`;
                setCphBadge(true, `${acCount}/${totalCount}`, allAc ? 'ac' : (acCount < totalCount ? 'wa' : ''));
            } else {
                judgeVerdict.textContent = '—';
                judgeVerdict.className = 'v-pending';
                judgeSummary.textContent = cphTestCases.length + ' 个测试点';
                setCphBadge(cphTestCases.length > 0, cphTestCases.length + ' 个', '');
            }

            if(cphTestCases.length === 0){
                judgeBody.innerHTML = `<div id="cph-empty">暂无测试点<br><span style="font-size:11px">点击「+ 添加测试点」或上传 zip 测试包</span></div>`;
                return;
            }

            for(const tc of cphTestCases){
                const row = document.createElement('div');
                row.className = 'tc-row';
                row.dataset.num = tc.num;
                const vClass = tc.verdict ? 'v-' + tc.verdict.toLowerCase() : '';
                const actualClass = tc.verdict === 'WA' ? 'wa' : tc.verdict === 'AC' ? 'ac' : '';
                let html = `<div class="tc-num">#${tc.num}</div>`;
                html += `<div class="tc-io"><label>Input</label><textarea class="tc-input" rows="2">${escapeHtml(tc.input || '')}</textarea></div>`;
                html += `<div class="tc-io"><label>Expected</label><textarea class="tc-expected" rows="2">${escapeHtml(tc.expected || '')}</textarea></div>`;
                html += `<div class="tc-verdict ${vClass}">${escapeHtml(tc.verdict || '—')}</div>`;
                html += `<div class="tc-time">${tc.time_ms ? tc.time_ms + 'ms' : '—'}<span class="tc-mem">${tc.mem_kb ? (tc.mem_kb >= 1024 ? (tc.mem_kb/1024).toFixed(1)+'MB' : tc.mem_kb+'KB') : ''}</span></div>`;
                html += `<div class="tc-actions">`;
                html += `<button class="run" title="运行此测试点">▶</button>`;
                html += `<button class="open-in" title="在工作区打开 .in 文件">in</button>`;
                html += `<button class="open-out" title="在工作区打开 .out 文件">out</button>`;
                html += `<button class="del" title="删除此测试点">🗑</button>`;
                html += `</div>`;
                if(tc.actual !== undefined){
                    html += `<div class="tc-io" style="grid-column:2/-1"><label>Actual Output</label><textarea class="actual ${actualClass}" rows="2" readonly>${escapeHtml(tc.actual || '')}</textarea></div>`;
                }
                if(tc.stderr){
                    html += `<div class="tc-stderr">${escapeHtml(tc.stderr)}</div>`;
                }
                row.innerHTML = html;
                // 绑定事件
                row.querySelector('.run').addEventListener('click', () => runSingleCPH(tc.num));
                row.querySelector('.del').addEventListener('click', () => deleteCPH(tc.num));
                row.querySelector('.open-in').addEventListener('click', () => openTestFile(tc.num, 'in'));
                row.querySelector('.open-out').addEventListener('click', () => openTestFile(tc.num, 'out'));
                // 自动保存 on blur
                row.querySelector('.tc-input').addEventListener('blur', () => saveCPHField(tc.num, 'in', row.querySelector('.tc-input').value));
                row.querySelector('.tc-expected').addEventListener('blur', () => saveCPHField(tc.num, 'out', row.querySelector('.tc-expected').value));
                judgeBody.appendChild(row);
            }
        }

        // 从 DOM 同步最新编辑值到 cphTestCases,避免 renderCPH 重建时丢失未保存输入
        function syncCPHFromDOM(){
            document.querySelectorAll('.tc-row').forEach(row => {
                const num = parseInt(row.dataset.num);
                const tc = cphTestCases.find(t => t.num === num);
                if(tc){
                    const inp = row.querySelector('.tc-input');
                    const exp = row.querySelector('.tc-expected');
                    if(inp) tc.input = inp.value;
                    if(exp) tc.expected = exp.value;
                }
            });
        }

        async function runSingleCPH(num){
            if(!currentFile || cphRunning) return;
            syncCPHFromDOM();
            const tc = cphTestCases.find(t => t.num === num);
            if(!tc) return;
            cphRunning = true;
            try{
                // 先把当前编辑值落盘,再运行,避免服务器读到空文件
                await saveCPHField(num, 'in', tc.input || '');
                await saveCPHField(num, 'out', tc.expected || '');
                tc.verdict = '...';
                tc.actual = undefined;
                tc.stderr = undefined;
                tc.time_ms = 0;
                renderCPH();
                try{
                    const res = await fetch('/api/test/run', {
                        method:'POST',
                        headers:{'Content-Type':'application/json'},
                        body: JSON.stringify({ path: currentFile, num: num })
                    });
                    const result = await res.json();
                    // 仅合并评测结果,不覆盖本地 input/expected
                    tc.verdict = result.verdict;
                    tc.actual = result.actual;
                    tc.stderr = result.stderr;
                    tc.time_ms = result.time_ms;
                    tc.mem_kb = result.mem_kb;
                    renderCPH();
                }catch(e){
                    tc.verdict = 'RE';
                    tc.stderr = '请求失败';
                    renderCPH();
                }
            } finally {
                cphRunning = false;
            }
        }

        let cphRunning = false;   // 防重入: 连点"运行"时避免并发评测交错渲染
        async function runAllCPH(){
            if(!currentFile || cphTestCases.length === 0 || cphRunning) return;
            cphRunning = true;
            try{
            await runAllCPHInner();
            } finally { cphRunning = false; }
        }
        async function runAllCPHInner(){
            syncCPHFromDOM();
            judgeVerdict.textContent = '…';
            judgeVerdict.className = 'v-pending';
            judgeSummary.textContent = '评测中...';
            // 重置所有结果
            cphTestCases.forEach(tc => { tc.verdict = null; tc.actual = undefined; tc.stderr = undefined; tc.time_ms = 0; });
            renderCPH();
            try{
                // 保存编辑过的测试数据
                await saveAllCPH();
                const res = await fetch('/api/judge', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({path:currentFile}) });
                const result = await res.json();
                if(result.error){
                    judgeVerdict.textContent = '—'; judgeVerdict.className = 'v-pending';
                    judgeSummary.textContent = result.error;
                    return;
                }
                if(result.verdict === 'CE'){
                    judgeVerdict.textContent = 'CE';
                    judgeVerdict.className = 'v-ce';
                    judgeSummary.textContent = 'Compile Error';
                    judgeBody.innerHTML = `<pre style="color:var(--err);white-space:pre-wrap;padding:10px;">${escapeHtml(result.compile_error || '')}</pre>`;
                    return;
                }
                // 合并结果到 cphTestCases(不覆盖本地 input/expected)
                if(result.cases){
                    for(const c of result.cases){
                        const m = c.case.match(/(\d+)/);
                        const num = m ? parseInt(m[1]) : 0;
                        const tc = cphTestCases.find(t => t.num === num);
                        if(tc){
                            tc.verdict = c.verdict;
                            tc.actual = c.actual;
                            tc.stderr = c.stderr;
                            tc.time_ms = c.time_ms;
                            tc.mem_kb = c.mem_kb;
                        }
                    }
                }
                renderCPH();
                socket.emit('judge_result', { path: currentFile, result: result });
            }catch(e){
                showToast('评测请求失败','error');
            }
        }
        cphRunAll.addEventListener('click', () => { openDock('cph'); runAllCPH(); });

        async function addCPH(){
            if(!currentFile) return;
            try{
                const res = await fetch('/api/test/add', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({path:currentFile}) });
                const data = await res.json();
                if(data.ok){
                    showToast(`已添加测试点 #${data.num}`, 'success');
                    await loadCPH(currentFile);
                } else {
                    showToast(data.error || '添加失败', 'error');
                }
            }catch(e){ showToast('请求失败','error'); }
        }
        cphAdd.addEventListener('click', addCPH);

        async function deleteCPH(num){
            if(!currentFile) return;
            try{
                const res = await fetch('/api/test/delete', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({path:currentFile, num:num}) });
                const data = await res.json();
                if(data.ok){
                    showToast(`已删除测试点 #${num}`, 'info');
                    await loadCPH(currentFile);
                }
            }catch(e){ showToast('请求失败','error'); }
        }

        // 在工作区打开测试点对应的 .in/.out 文件
        function openTestFile(num, ext){
            if(!currentFile) return;
            const base = currentFile.replace(/\.[^.]+$/, '');
            openFile(`${base}_T/${num}.${ext}`, null);
        }

        async function saveCPHField(num, ext, content){
            if(!currentFile) return;
            const base = currentFile.replace(/\.[^.]+$/, '');
            const path = `${base}_T/${num}.${ext}`;
            try{
                await fetch('/api/test/save', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({path:path, content:content}) });
            }catch(e){}
        }

        async function saveAllCPH(){
            if(!currentFile) return;
            const base = currentFile.replace(/\.[^.]+$/, '');
            const promises = [];
            for(const tc of cphTestCases){
                promises.push(fetch('/api/test/save', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({path:`${base}_T/${tc.num}.in`, content:tc.input || ''}) }));
                promises.push(fetch('/api/test/save', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({path:`${base}_T/${tc.num}.out`, content:tc.expected || ''}) }));
            }
            await Promise.all(promises);
        }
        cphSaveAll.addEventListener('click', async () => {
            // 从 DOM 收集最新值
            document.querySelectorAll('.tc-row').forEach(row => {
                const num = parseInt(row.dataset.num);
                const tc = cphTestCases.find(t => t.num === num);
                if(tc){
                    tc.input = row.querySelector('.tc-input').value;
                    tc.expected = row.querySelector('.tc-expected').value;
                }
            });
            await saveAllCPH();
            showToast('测试点已保存', 'success');
        });

        function renderJudgeResult(result){
            // 协同广播来的评测结果
            syncCPHFromDOM();
            if(result.error){
                judgeVerdict.textContent = '—'; judgeVerdict.className = 'v-pending'; judgeSummary.textContent = result.error;
                return;
            }
            if(result.verdict === 'CE'){
                judgeVerdict.textContent = 'CE'; judgeVerdict.className = 'v-ce';
                judgeSummary.textContent = 'Compile Error';
                judgeBody.innerHTML = `<pre style="color:var(--err);white-space:pre-wrap;padding:10px;">${escapeHtml(result.compile_error || '')}</pre>`;
                return;
            }
            if(result.cases){
                for(const c of result.cases){
                    const m = c.case.match(/(\d+)/);
                    const num = m ? parseInt(m[1]) : 0;
                    const tc = cphTestCases.find(t => t.num === num);
                    if(tc){
                        tc.verdict = c.verdict;
                        tc.actual = c.actual;
                        tc.stderr = c.stderr;
                        tc.time_ms = c.time_ms;
                        tc.mem_kb = c.mem_kb;
                    }
                }
