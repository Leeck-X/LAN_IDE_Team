        // ===================== 代码问题面板 =====================
        function renderProblems(){
            const errors = problemList.filter(p => p.severity === 1).length;
            const warnings = problemList.filter(p => p.severity === 2).length;
            const others = problemList.length - errors - warnings;
            updateDFrameProblemCount(); // D 框错误/警告计数与问题面板保持同步
            if(problemList.length === 0){
                problemsSummary.textContent = '';
                problemsBadge.style.display = 'none';
                problemsList.innerHTML = `<div id="problems-empty">没有检测到代码问题</div>`;
                updateCodeOverlay();
                return;
            }
            const parts = [];
            if(errors) parts.push(errors + ' 个错误');
            if(warnings) parts.push(warnings + ' 个警告');
            if(others) parts.push(others + ' 个其他');
            problemsSummary.textContent = parts.join(' · ');
            if(errors > 0){
                problemsBadge.style.display = 'inline-block';
                problemsBadge.textContent = errors;
                problemsBadge.className = 'badge error';
            } else if(warnings > 0){
                problemsBadge.style.display = 'inline-block';
                problemsBadge.textContent = warnings;
                problemsBadge.className = 'badge warning';
            } else {
                problemsBadge.style.display = 'inline-block';
                problemsBadge.textContent = others;
                problemsBadge.className = 'badge';
            }
            const sevLabel = { 1:'E', 2:'W', 3:'I', 4:'H' };
            const sevClass = { 1:'error', 2:'warning', 3:'info', 4:'hint' };
            const fileName = currentFile ? currentFile.split('/').pop() : '';
            problemsList.innerHTML = '';
            problemList.forEach(p => {
                const rangeText = (p.endLine && p.endColumn && (p.endLine !== p.line || p.endColumn !== p.column))
                    ? `${p.line}:${p.column} - ${p.endLine}:${p.endColumn}`
                    : `${p.line}:${p.column}`;
                const meta = [];
                if(p.source) meta.push(p.source);
                if(p.code !== undefined && p.code !== null && p.code !== '') meta.push(String(p.code));
                const metaText = meta.length ? '  [' + meta.join(': ') + ']' : '';
                const row = document.createElement('div');
                row.className = 'prob-row';
                row.title = p.message + (meta.length ? ' [' + meta.join(': ') + ']' : '');
                row.innerHTML = `
                    <span class="prob-sev ${sevClass[p.severity] || 'hint'}">${sevLabel[p.severity] || 'H'}</span>
                    <div class="prob-body">
                        <div class="prob-msg">${escapeHtml(p.message)}</div>
                        <div class="prob-loc">${escapeHtml(fileName)}:${rangeText}${escapeHtml(metaText)}</div>
                    </div>`;
                row.addEventListener('click', () => gotoProblem(p));
                problemsList.appendChild(row);
            });
            updateCodeOverlay();
        }
        function offsetForPos(text, line, column){
            const lines = text.split('\n');
            let offset = 0;
            for(let i=0; i < line - 1 && i < lines.length; i++) offset += lines[i].length + 1;
            return offset + Math.max(0, column - 1);
        }
        function updateCodeOverlay(){
            if(!codeOverlay) return;
            if(currentEditorType !== 'textarea'){
                codeOverlay.style.display = 'none';
                codeOverlay.innerHTML = '';
                return;
            }
            const text = codeEl.value || '';
            const ranges = [];
            for(const p of problemList){
                if(p.severity !== 1 && p.severity !== 2) continue;
                const s = offsetForPos(text, p.line, p.column);
                const e = offsetForPos(text, p.endLine || p.line, p.endColumn || p.column);
                if(e <= s) continue;
                ranges.push({ s, e, cls: p.severity === 1 ? 'sq-error' : 'sq-warning' });
            }
            ranges.sort((a,b) => a.s - b.s);
            let html = '';
            let last = 0;
            const len = text.length;
            for(const r of ranges){
                if(r.s < last) continue;
                const safeStart = Math.max(0, Math.min(r.s, len));
                const safeEnd = Math.max(safeStart, Math.min(r.e, len));
                if(safeEnd <= safeStart) continue;
                html += escapeHtml(text.slice(last, safeStart));
                html += `<span class="${r.cls}">${escapeHtml(text.slice(safeStart, safeEnd))}</span>`;
                last = safeEnd;
            }
            html += escapeHtml(text.slice(last));
            codeOverlay.innerHTML = html;
            codeOverlay.style.display = 'block';
            codeOverlay.scrollTop = codeEl.scrollTop;
            codeOverlay.scrollLeft = codeEl.scrollLeft;
        }
        function gotoProblem(p){
            if(!p) return;
            if(monacoEditor){
                monacoEditor.revealLineInCenter(p.line);
                monacoEditor.setPosition({ lineNumber: p.line, column: Math.max(1, p.column) });
                monacoEditor.focus();
            } else if(currentEditorType === 'textarea'){
                const lines = codeEl.value.split('\n');
                let offset = 0;
                for(let i=0; i < p.line - 1 && i < lines.length; i++) offset += lines[i].length + 1;
                offset += Math.max(0, p.column - 1);
                codeEl.focus();
                codeEl.setSelectionRange(offset, offset);
                const lineHeight = parseFloat(getComputedStyle(codeEl).lineHeight) || 21;
                codeEl.scrollTop = Math.max(0, (p.line - 1) * lineHeight);
            }
        }
        const problemsClear = document.getElementById('problems-clear');
        if(problemsClear){
            problemsClear.addEventListener('click', () => {
                problemList = [];
                renderProblems();
                if(monacoEditor && monacoEditor.getModel()){
                    monaco.editor.setModelMarkers(monacoEditor.getModel(), 'clangd', []);
                }
            });
        }

        // ===================== 编辑器字号 =====================
        function applyFontSize(size){
            size = Math.min(32, Math.max(8, size));
            editorFontSize = size;
            localStorage.setItem('editor-font-size', size);
            // 行高随字号等比缩放(约 1.5 倍), 否则只变宽不变高(Monaco lineHeight 固定值会导致文字重叠)
            const lh = Math.round(size * 1.5);
            if(monacoEditor){ monacoEditor.updateOptions({ fontSize: size, lineHeight: lh }); }
            if(rightMonaco){ rightMonaco.updateOptions({ fontSize: size, lineHeight: lh }); }
            if(currentEditorType === 'textarea'){
                codeEl.style.fontSize = size + 'px';
                codeEl.style.lineHeight = '1.6';
                gutterEl.style.fontSize = size + 'px';
                gutterEl.style.lineHeight = '1.6';
            }
        }
        function fontDecrease(){ applyFontSize(editorFontSize - 1); }
        function fontIncrease(){ applyFontSize(editorFontSize + 1); }
        function fontReset(){ applyFontSize(14); }

        // ===================== Markdown 预览 + 文件分屏 =====================
        const mdContainer = document.getElementById('md-container');
        const mdEditorWrap = document.getElementById('md-editor-wrap');
        const mdToolbar = document.getElementById('md-toolbar');
        const splitLeft = document.getElementById('split-left');
        const splitRight = document.getElementById('split-right');
        const splitDivider = document.getElementById('split-divider');
        const splitClose = document.getElementById('split-close');
        const splitRightClose = document.getElementById('split-right-close');
        const splitRightLabel = document.getElementById('split-right-label');
        const splitRightEditorWrap = document.getElementById('split-right-editor-wrap');
        const splitRightMonaco = document.getElementById('split-right-monaco');
        const splitRightPreview = document.getElementById('split-right-preview');

        let splitMode = false;
        let rightFile = null;
        let rightOpenTabs = [];  // 右侧分屏打开的标签(文件路径列表)
        let rightMonaco = null;
        let rightMonacoLoaded = false;
        let rightFileContent = null;
        let rightRemoteCursors = {};
        let rightRemoteWidgets = {};
        let splitRatio = parseFloat(localStorage.getItem('split-ratio')) || 0.5;
        let isSplitDragging = false;
        let isPreviewMode = false;
        let mdDomMoved = false;
        let rightDirty = false;
        let rightSaveTimer = null;
        // 右侧分屏的独立 OT 状态(与主编辑器完全对称, 左右可任意切换编辑, 双向实时同步)
        let rightOtRevision = -1;
        let rightOtOutstanding = null;
        let rightOtBuffer = null;
        let rightOtInbox = new Map();
        let rightOtGapTimer = null;
        let rightOtSynced = false;
        let rightLastContent = null;
        let rightApplyingRemote = false;
        let mdMode = 'edit';
        let isMarkdownFile = false;
        let mdPreviewTimer = null;
        let mdLastContent = '';

        // ===================== 右侧分屏独立 OT 状态机 =====================
        function updateRightEditorReadOnly(){
            // 与主编辑器一致: 未同步或管理员只读时锁定右侧分屏
            const ro = !rightOtSynced || myReadonly;
            try { if(rightMonaco) rightMonaco.updateOptions({ readOnly: ro }); } catch(e){}
        }
        function rightOtReset(){
            rightOtRevision = -1; rightOtOutstanding = null; rightOtBuffer = null; rightOtSynced = false;
            rightOtInbox.clear(); if(rightOtGapTimer){ clearTimeout(rightOtGapTimer); rightOtGapTimer = null; }
            updateRightEditorReadOnly();
        }
        function rightOtSend(op){ socket.emit('edit', { path: rightFile, op: op.toJSON(), base: rightOtRevision }, (ack)=>rightOtHandleAck(ack)); }
        function rightOtHandleAck(ack){
            if(!ack) return;
            if(ack.readonly){ setMyReadonly(true); showToast('你已被管理员设为只读模式', 'warning'); return; }
            if(ack.resync || ack.version == null){ rightResync(); return; }
            rightOtEnqueue(ack.version, 'ack');
        }
        function rightOtEnqueue(version, kind, op){
            if(typeof version !== 'number' || version <= rightOtRevision) return;
            rightOtInbox.set(version, {kind, op});
            rightOtDrain();
        }
        function rightOtDrain(){
            while(rightOtInbox.has(rightOtRevision + 1)){
                const m = rightOtInbox.get(rightOtRevision + 1);
                rightOtInbox.delete(rightOtRevision + 1);
                if(m.kind === 'ack') rightOtApplyAck(); else rightOtApplyServer(m.op);
            }
            if(rightOtInbox.size > 0 && !rightOtInbox.has(rightOtRevision + 1)){
                if(!rightOtGapTimer) rightOtGapTimer = setTimeout(()=>{ rightOtGapTimer = null; if(rightOtInbox.size > 0 && !rightOtInbox.has(rightOtRevision + 1)) rightResync(); }, 8000);
            } else if(rightOtGapTimer){ clearTimeout(rightOtGapTimer); rightOtGapTimer = null; }
        }
        function rightOtApplyLocal(op){
            if(rightOtRevision < 0) return;
            if(rightOtOutstanding === null){ rightOtOutstanding = op; rightOtSend(op); }
            else if(rightOtBuffer !== null){ rightOtBuffer = rightOtBuffer.compose(op); }
            else { rightOtBuffer = op; }
        }
        function rightOtApplyServer(op){
            rightOtRevision += 1;
            if(rightOtOutstanding === null){
                rightApplyingRemote = true; applyOpToRightEditor(op); rightApplyingRemote = false;
            } else if(rightOtBuffer !== null){
                const p1 = TextOp.transform(rightOtOutstanding, op);
                const p2 = TextOp.transform(rightOtBuffer, p1[1]);
                rightApplyingRemote = true; applyOpToRightEditor(p2[1]); rightApplyingRemote = false;
                rightOtOutstanding = p1[0]; rightOtBuffer = p2[0];
            } else {
                const p1 = TextOp.transform(rightOtOutstanding, op);
                rightApplyingRemote = true; applyOpToRightEditor(p1[1]); rightApplyingRemote = false;
                rightOtOutstanding = p1[0];
            }
        }
        function rightOtApplyAck(){
            rightOtRevision += 1;
            if(rightOtOutstanding !== null){
                if(rightOtBuffer !== null){ const b = rightOtBuffer; rightOtBuffer = null; rightOtOutstanding = b; rightOtSend(b); }
                else { rightOtOutstanding = null; }
            }
        }
        function applyOpToRightEditor(op){
            if(!rightMonaco) return;
            const model = rightMonaco.getModel();
            const edits = [];
            let pos = 0;
            for(const c of op.ops){
                if(otIsRetain(c)){ pos += c; }
                else if(otIsInsert(c)){
                    const p = model.getPositionAt(pos);
                    edits.push({ range: new monaco.Range(p.lineNumber, p.column, p.lineNumber, p.column), text: c });
                } else {
                    const n = -c;
                    const s = model.getPositionAt(pos);
                    const e = model.getPositionAt(pos + n);
                    edits.push({ range: new monaco.Range(s.lineNumber, s.column, e.lineNumber, e.column), text: '' });
                    pos += n;
                }
            }
            model.applyEdits(edits);
            rightLastContent = rightMonaco.getValue();
            rightFileContent = rightLastContent;
        }
        function rightResync(){
            if(!rightFile) return;
            rightOtReset();
            socket.emit('join', { path: rightFile, username: username, device: deviceLabel() + ' (右)' });
        }

        function initSplit(){
            splitDivider.addEventListener('mousedown', (e)=>{
                isSplitDragging = true;
                splitDivider.classList.add('active');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                e.preventDefault();
            });
            document.addEventListener('mousemove', (e)=>{
                if(!isSplitDragging) return;
                const rect = mdContainer.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const total = rect.width;
                splitRatio = Math.max(0.15, Math.min(0.85, x / total));
                applySplitRatio();
            });
            document.addEventListener('mouseup', ()=>{
                if(isSplitDragging){
                    isSplitDragging = false;
                    splitDivider.classList.remove('active');
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                    localStorage.setItem('split-ratio', splitRatio);
                    if(monacoEditor) setTimeout(()=>monacoEditor.layout(), 50);
                    if(rightMonaco) setTimeout(()=>rightMonaco.layout(), 50);
                }
            });
            window.addEventListener('resize', ()=>{ if(splitMode) applySplitRatio(); });
            splitClose.addEventListener('click', closeSplit);
            splitRightClose.addEventListener('click', closeSplit);
        }

        function applySplitRatio(){
            const total = mdContainer.clientWidth;
            if(total < 160){
                splitLeft.style.flex = '1'; splitRight.style.flex = '1';
                splitLeft.style.flexBasis = 'auto'; splitRight.style.flexBasis = 'auto';
                return;
            }
            const leftWidth = Math.max(80, total * splitRatio);
            const rightWidth = Math.max(80, total * (1 - splitRatio));
            splitLeft.style.flex = '0 0 ' + leftWidth + 'px';
            splitRight.style.flex = '0 0 ' + rightWidth + 'px';
        }

        function openSplit(filePath){
            splitMode = true;
            isPreviewMode = false;
            splitRight.style.display = 'flex';
            splitRightEditorWrap.style.display = 'flex';
            splitRightPreview.style.display = 'none';
            splitDivider.style.display = 'block';
            splitClose.style.display = 'inline-block';
            applySplitRatio();
            openFileInRight(filePath);
            if(monacoEditor) setTimeout(()=>monacoEditor.layout(), 50);
        }

        function closeSplit(){
            splitMode = false;
            isPreviewMode = false;
            splitRight.style.display = 'none';
            splitDivider.style.display = 'none';
            splitClose.style.display = 'none';
            splitLeft.style.flex = '1'; splitLeft.style.flexBasis = 'auto';
            splitRight.style.flex = '1'; splitRight.style.flexBasis = 'auto';
            if(rightFile){ socket.emit('leave', { path: rightFile }); }
            if(rightMonaco){ rightMonaco.dispose(); rightMonaco = null; rightMonacoLoaded = false; }
            rightFile = null;
            rightOpenTabs = [];
            rightFileContent = null;
            rightLastContent = null;
            rightOtReset();
            rightRemoteCursors = {};
            rightRemoteWidgets = {};
            rightDirty = false;
            splitRightLabel.style.display = 'none';
            renderRightTabs();
            if(monacoEditor) setTimeout(()=>monacoEditor.layout(), 50);
        }

        function toggleSplit(filePath){
            if(!splitMode){ openSplit(filePath); }
            else if(filePath === rightFile){ if(rightMonaco) rightMonaco.focus(); }
            else { openFileInRight(filePath); }
        }

        function renderRightTabs(){
            const bar = document.getElementById('split-right-tabs');
            if(!bar) return;
            bar.innerHTML = '';
            rightOpenTabs.forEach(p => {
                const tab = document.createElement('span');
                tab.className = 'rtab' + (p === rightFile ? ' active' : '');
                tab.title = p;
                const name = document.createElement('span');
                name.className = 'rt-name';
                name.textContent = p.split('/').pop();
                tab.appendChild(name);
                const close = document.createElement('span');
                close.className = 'rt-close';
                close.textContent = '×';
                close.title = '关闭';
                close.addEventListener('click', (e)=>{ e.stopPropagation(); closeRightTab(p); });
                tab.appendChild(close);
                tab.addEventListener('click', ()=>{ if(p !== rightFile) openFileInRight(p); });
                bar.appendChild(tab);
            });
            // 右侧标签与主标签同处一条标签栏, 中间以竖线分隔
            const barWrap = document.getElementById('right-tabs-bar');
            const sep = document.getElementById('tab-sep');
            const hasRight = rightOpenTabs.length > 0;
            bar.style.display = hasRight ? 'flex' : 'none';
            if(barWrap) barWrap.style.display = hasRight ? 'flex' : 'none';
            if(sep) sep.style.display = hasRight ? 'block' : 'none';
            updateTabWrapVisibility();
        }

        function updateTabWrapVisibility(){
            const wrap = document.getElementById('editor-tabs-wrap');
            if(wrap) wrap.style.display = (openTabs.length || rightOpenTabs.length) ? 'flex' : 'none';
        }

        function closeRightTab(path){
            const idx = rightOpenTabs.indexOf(path);
            if(idx === -1) return;
            rightOpenTabs.splice(idx, 1);
            if(path === rightFile){
                if(rightOpenTabs.length){
                    openFileInRight(rightOpenTabs[Math.min(idx, rightOpenTabs.length - 1)]);
                } else {
                    closeSplit();
                    return;
                }
            }
            renderRightTabs();
        }

        async function openFileInRight(filePath){
            if(!filePath) return;
            // 离开旧的右侧房间, 避免残留在旧文件房间持续收到无关事件
            if(rightFile && rightFile !== filePath){
                socket.emit('leave', { path: rightFile });
            }
            if(rightOpenTabs.indexOf(filePath) === -1) rightOpenTabs.push(filePath);
            rightFile = filePath;
            try{
                const res = await fetch('/api/file?path=' + encodeURIComponent(filePath));
                const data = await res.json();
                if(data.error){ showToast('打开失败: ' + data.error, 'error'); return; }
                rightFileContent = data.content || '';
            }catch(e){ showToast('加载失败', 'error'); return; }
            splitRightLabel.textContent = filePath.split('/').pop();
            splitRightLabel.title = filePath;
            renderRightTabs();
            rightLastContent = rightFileContent;
            rightOtReset();
            if(!rightMonacoLoaded) initRightMonaco();
            if(rightMonaco){
                rightApplyingRemote = true;
                rightMonaco.setValue(rightFileContent);
                rightApplyingRemote = false;
                try { monaco.editor.setModelLanguage(rightMonaco.getModel(), langForExt(extOf(filePath))); } catch(e){}
                setTimeout(()=>rightMonaco.layout(), 50);
            }
            socket.emit('join', { path: filePath, username: username, device: deviceLabel() + ' (右)' });
        }

        function initRightMonaco(){
            if(rightMonacoLoaded) return;
            const requireFn = window.monacoRequire || window.require;
            if(!requireFn){ setTimeout(initRightMonaco, 200); return; }
            requireFn(['vs/editor/editor.main'], ()=>{
                rightMonaco = monaco.editor.create(splitRightMonaco, {
                    value: rightFileContent || '',
                    language: 'plaintext',
                    theme: 'cpp26-dark',
                    readOnly: !rightOtSynced,
                    automaticLayout: true,
                    lineNumbersMinChars: 2,
                    lineDecorationsWidth: 4,
                    fontFamily: "'Cascadia Code','Cascadia Mono','Fira Code','Consolas',monospace",
                    fontSize: editorFontSize || 14,
                    lineHeight: Math.round((editorFontSize || 14) * 1.5),
                    minimap: { enabled: true, maxColumn: 80 },
                    padding: { top: 12 },
                    smoothScrolling: true,
                    cursorSmoothCaretAnimation: true,
                    fontLigatures: true,
                    suggestOnTriggerCharacters: true,
                    quickSuggestions: { other: true, comments: false, strings: false },
                    tabSize: 4,
                    insertSpaces: true,
                    scrollBeyondLastLine: false
                });
                rightMonacoLoaded = true;
                // 首次创建后立即应用内容与语言(此前只有后续打开才会设置语言)
                if(rightFileContent != null){
                    rightMonaco.setValue(rightFileContent);
                }
                if(rightFile){
                    try { monaco.editor.setModelLanguage(rightMonaco.getModel(), langForExt(extOf(rightFile))); } catch(e){}
                }
                rightMonaco.onDidChangeModelContent(()=>{
                    if(rightApplyingRemote || !rightFile) return;
                    const newContent = rightMonaco.getValue();
                    // 与主编辑器一致: diff 成单次替换操作走 OT 管线, 实时同步给同文件的其他协作者
                    if(rightLastContent !== null){
                        const op = computeDiff(rightLastContent, newContent);
                        if(op.start !== op.end || op.text.length > 0){
                            rightOtApplyLocal(TextOp.fromSplice(op, rightLastContent.length));
                        }
                    }
                    rightLastContent = newContent;
                    rightFileContent = newContent;
                    rightDirty = true;
                    clearTimeout(rightSaveTimer);
                    const savePath = rightFile;
                    rightSaveTimer = setTimeout(()=>{
                        if(rightFile === savePath){ socket.emit('save', { path: rightFile, content: rightFileContent }); rightDirty = false; }
                    }, 1500);
                });
                rightMonaco.onDidChangeCursorPosition(()=>{
                    const pos = rightMonaco.getPosition();
                    if(pos && rightFile){
                        const offset = rightMonaco.getModel().getOffsetAt(pos);
                        socket.emit('cursor', { path: rightFile, offset: offset });
                    }
                });
                rightMonaco.addAction({
                    id: 'right-format-document',
                    label: '格式化文档',
                    keybindings: [monaco.KeyMod.Shift | monaco.KeyMod.Alt | monaco.KeyCode.KeyF],
                    contextMenuGroupId: '2_editor',
                    contextMenuOrder: 1,
                    run: (ed)=>{ ed.getAction('editor.action.formatDocument').run(); }
                });
                applySplitRatio();
            });
        }

        function renderRightRemoteCursors(){
            if(!rightMonaco || !rightMonacoLoaded) return;
            if(!remoteCursorsVisible){
                for(const sid in rightRemoteWidgets){
                    try { rightMonaco.removeContentWidget(rightRemoteWidgets[sid]); } catch(e){}
                    delete rightRemoteWidgets[sid];
                }
                return;
            }
            const now = Date.now();
            const model = rightMonaco.getModel();
            if(!model) return;
            const len = model.getValueLength();
            for(const sid in rightRemoteWidgets){
                if(!rightRemoteCursors[sid] || (now - rightRemoteCursors[sid].ts > 10000)){
                    try { rightMonaco.removeContentWidget(rightRemoteWidgets[sid]); } catch(e){}
                    delete rightRemoteWidgets[sid];
                }
            }
            for(const sid in rightRemoteCursors){
                const u = rightRemoteCursors[sid];
                if(now - u.ts > 10000) continue;
                const off = Math.max(0, Math.min(u.offset, len));
                const pos = model.getPositionAt(off);
                if(rightRemoteWidgets[sid]){
                    try { rightMonaco.removeContentWidget(rightRemoteWidgets[sid]); } catch(e){}
                    delete rightRemoteWidgets[sid];
                }
                const domEl = document.createElement('div');
                domEl.className = 'remote-cursor';
                domEl.style.borderLeftColor = u.color;
                domEl.innerHTML = `<span class="remote-cursor-name" style="background:${u.color}">${escapeHtml(u.username)}</span>`;
                const widget = {
                    getId: ()=>'rrc-' + sid,
                    getDomNode: ()=>domEl,
                    getPosition: ()=>({
                        position: { lineNumber: pos.lineNumber, column: pos.column },
                        preference: [monaco.editor.ContentWidgetPositionPreference.EXACT]
                    })
                };
                rightMonaco.addContentWidget(widget);
                rightRemoteWidgets[sid] = widget;
            }
        }
        setInterval(renderRightRemoteCursors, 2000);

        // 右侧分屏的远程光标 / 文档同步
        socket.on('cursor', (data)=>{
            if(!data || typeof data.offset !== 'number') return;
            if(splitMode && rightFile && data.path === rightFile){
                const uname = data.username || '匿名';
                rightRemoteCursors[data.sid || 'unknown'] = { username: uname, color: colorFor(uname), offset: data.offset, ts: Date.now() };
                renderRightRemoteCursors();
            }
        });
        socket.on('doc_sync', (data)=>{
            if(!data) return;
            if(splitMode && rightFile && data.path === rightFile){
                rightFileContent = data.content;
                rightLastContent = data.content;
                rightOtReset();
                rightOtRevision = (typeof data.version === 'number') ? data.version : 0;
                rightOtSynced = true;
                updateRightEditorReadOnly();
                if(rightMonaco && rightMonacoLoaded){
                    rightApplyingRemote = true;
                    rightMonaco.setValue(data.content);
                    rightApplyingRemote = false;
                }
            }
        });
        socket.on('edit', (data)=>{
            if(!(splitMode && rightFile && data.path === rightFile)) return;
            if(typeof data.version === 'number' && data.op){
                let op;
                try { op = TextOp.fromJSON(data.op); }
                catch(e){ rightResync(); return; }
                rightOtEnqueue(data.version, 'remote', op);
            }
        });

        // ===================== Markdown 渲染 =====================
        function setupMarkdownForCurrentFile(){
            const isMd = /\.(md|markdown)$/i.test(currentFile || '');
            if(isMd){
                isMarkdownFile = true;
                mdToolbar.style.display = 'flex';
                if(mdMode !== 'edit'){ applyMdMode(); }
            } else {
                isMarkdownFile = false;
                mdToolbar.style.display = 'none';
                if(splitMode && isPreviewMode) closeSplit();
                if(monacoEditor) setTimeout(()=>monacoEditor.layout(), 50);
            }
        }

        function applyMdMode(){
            if(!mdDomMoved){
                const monacoEl = document.getElementById('monaco-editor');
                const frameEl = document.getElementById('editor-frame');
                if(!mdEditorWrap.contains(monacoEl) && monacoEl) mdEditorWrap.appendChild(monacoEl);
                if(!mdEditorWrap.contains(frameEl) && frameEl) mdEditorWrap.appendChild(frameEl);
                mdDomMoved = true;
            }
            if(mdMode === 'edit'){
                if(splitMode) closeSplit();
                splitLeft.style.flex = '1'; splitLeft.style.flexBasis = 'auto';
            } else if(mdMode === 'preview' || mdMode === 'split'){
                if(!splitMode || !isPreviewMode){
                    isPreviewMode = true;
                    splitMode = true;
                    splitRight.style.display = 'flex';
                    splitRightEditorWrap.style.display = 'none';
                    splitRightPreview.style.display = 'block';
                    splitDivider.style.display = 'block';
                    splitClose.style.display = 'inline-block';
                    splitRightLabel.textContent = '预览';
                    splitRightLabel.style.display = '';
                    const rTabs = document.getElementById('split-right-tabs');
                    if(rTabs) rTabs.style.display = 'none';
                    applySplitRatio();
                    renderMarkdown();
                    if(monacoEditor) setTimeout(()=>monacoEditor.layout(), 50);
                }
                applySplitRatio();
            }
        }

        function renderMarkdown(){
            if(!isMarkdownFile || !currentFile) return;
            const content = getEditorContent();
            if(content === mdLastContent) return;
            mdLastContent = content;
            try{
                if(typeof marked === 'undefined') throw new Error('marked 未加载');
                const html = marked.parse(content);
                splitRightPreview.innerHTML = html;
                if(typeof hljs !== 'undefined'){
                    splitRightPreview.querySelectorAll('pre code').forEach((block)=>{ try { hljs.highlightElement(block); } catch(e){} });
                }
            }catch(e){
                splitRightPreview.innerHTML = `<div style="color:var(--err);">渲染错误: ${escapeHtml(String(e.message || e))}</div>`;
            }
        }

        function initMarkdown(){
            document.querySelectorAll('.md-mode-btn').forEach((btn)=>{
                btn.addEventListener('click', ()=>{
                    document.querySelectorAll('.md-mode-btn').forEach((b)=>b.classList.remove('active'));
                    btn.classList.add('active');
                    mdMode = btn.dataset.mode;
                    applyMdMode();
                });
            });
            // textarea 模式下的实时渲染
            codeEl.addEventListener('input', ()=>{
                if(isMarkdownFile){
                    clearTimeout(mdPreviewTimer);
                    mdPreviewTimer = setTimeout(renderMarkdown, 300);
                }
            });
        }

        // Monaco 加载完成后挂载 Markdown 渲染钩子(轮询直到可用; 编辑器重建后重新挂载)
        let mdHookedEditor = null;
        function ensureMarkdownHook(){
            if(monacoEditor && monacoEditor !== mdHookedEditor){
                mdHookedEditor = monacoEditor;
                monacoEditor.onDidChangeModelContent(()=>{
                    if(isMarkdownFile){
                        clearTimeout(mdPreviewTimer);
                        mdPreviewTimer = setTimeout(renderMarkdown, 300);
                    }
                });
            }
            if(!monacoEditor || monacoEditor !== mdHookedEditor){
                setTimeout(ensureMarkdownHook, 500);
            }
        }

        // ===================== 文件模板 =====================
        const btnTemplates = document.getElementById('btn-templates');
        const templateModal = document.getElementById('template-modal');
        const tmplExt = document.getElementById('tmpl-ext');
        const tmplContent = document.getElementById('tmpl-content');
        const tmplLoad = document.getElementById('tmpl-load');
        const tmplSave = document.getElementById('tmpl-save');
        const tmplDelete = document.getElementById('tmpl-delete');
        const tmplClose = document.getElementById('tmpl-close');

        let userTemplates = {};
        async function loadTemplates(){
            try{
                const res = await fetch('/api/templates');
                userTemplates = (await res.json()) || {};
            }catch(e){ userTemplates = {}; }
        }
        function replaceTemplateVars(content, fileName){
            const now = new Date();
            const nameNoExt = fileName.replace(/\.[^.]+$/, '');
            const vars = {
                '{FileName}': fileName,
                '{FileNameNoExt}': nameNoExt,
                '{Date}': now.toISOString().slice(0,10),
                '{Time}': now.toTimeString().slice(0,8),
                '{Year}': String(now.getFullYear()),
                '{Month}': String(now.getMonth()+1).padStart(2,'0'),
                '{Day}': String(now.getDate()).padStart(2,'0'),
                '{Author}': username
            };
            let result = content;
            for(const key in vars){ result = result.split(key).join(vars[key]); }
            return result;
        }
        function initTemplateModal(){
            btnTemplates.addEventListener('click', ()=>{
                templateModal.style.display = 'flex';
                tmplExt.value = '';
                tmplContent.value = '';
                tmplExt.focus();
            });
            tmplClose.addEventListener('click', ()=>templateModal.style.display = 'none');
            templateModal.addEventListener('click', (e)=>{ if(e.target === templateModal) templateModal.style.display = 'none'; });
            tmplLoad.addEventListener('click', async ()=>{
                const ext = tmplExt.value.trim().toLowerCase();
                if(!ext){ showToast('请输入扩展名', 'warning'); return; }
                try{
                    const res = await fetch('/api/templates/' + encodeURIComponent(ext));
                    const content = await res.json();
                    tmplContent.value = typeof content === 'string' ? content : '';
                }catch(e){ tmplContent.value = ''; }
            });
            tmplExt.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') tmplLoad.click(); });
            tmplSave.addEventListener('click', async ()=>{
                const ext = tmplExt.value.trim().toLowerCase();
                if(!ext){ showToast('请输入扩展名', 'warning'); return; }
                const res = await fetch('/api/templates/' + encodeURIComponent(ext), {
                    method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ content: tmplContent.value })
                });
                const data = await res.json();
                if(data.ok){ userTemplates[ext] = tmplContent.value; showToast('模板已保存', 'success'); }
                else showToast('保存失败: ' + (data.error || '未知错误'), 'error');
            });
            tmplDelete.addEventListener('click', ()=>{
                const ext = tmplExt.value.trim().toLowerCase();
                if(!ext){ showToast('请输入扩展名', 'warning'); return; }
                showConfirm('确定要删除 .' + ext + ' 的模板配置吗？', async ()=>{
                    const res = await fetch('/api/templates/' + encodeURIComponent(ext), { method: 'DELETE' });
                    const data = await res.json();
                    if(data.ok){ delete userTemplates[ext]; tmplContent.value = ''; showToast('模板已删除', 'info'); }
                    else showToast('删除失败: ' + (data.error || '未知错误'), 'error');
                });
            });
        }

        // ===================== 主编辑器右键菜单: 格式化文档 =====================
        let formatHookedEditor = null;
        function ensureFormatAction(){
            if(monacoEditor && monacoEditor !== formatHookedEditor && typeof monaco !== 'undefined' && monaco.editor){
                formatHookedEditor = monacoEditor;
                monacoEditor.addAction({
                    id: 'format-document',
                    label: '格式化文档',
                    keybindings: [monaco.KeyMod.Shift | monaco.KeyMod.Alt | monaco.KeyCode.KeyF],
                    contextMenuGroupId: '2_editor',
                    contextMenuOrder: 1,
                    run: (ed)=>{ ed.getAction('editor.action.formatDocument').run(); }
                });
            }
            if(!monacoEditor || monacoEditor !== formatHookedEditor){
                setTimeout(ensureFormatAction, 500);
            }
        }

        // ===================== 初始化 =====================
        const dFontDecrease = document.getElementById('d-font-decrease');
        const dFontReset = document.getElementById('d-font-reset');
        const dFontIncrease = document.getElementById('d-font-increase');

        async function init(){
            applyFontSize(editorFontSize);
            initSplit();
            initMarkdown();
            ensureMarkdownHook();
            ensureFormatAction();
            loadTemplates();
            initTemplateModal();
            dFontDecrease.addEventListener('click', fontDecrease);
            dFontReset.addEventListener('click', fontReset);
            dFontIncrease.addEventListener('click', fontIncrease);
            if(currentEditorType === 'textarea'){
                monacoContainer.style.display = 'none';
                editorFrame.style.display = 'flex';
                codeEl.style.fontSize = editorFontSize + 'px';
                gutterEl.style.fontSize = editorFontSize + 'px';
            } else {
                editorFrame.style.display = 'none';
                monacoContainer.style.display = 'block';
                await loadMonaco(currentEditorType);
            }
            loadTree();
        }
        init();
    </script>
</body>
</html>
