<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#ffffff"/>
  <g fill="none" stroke="#d4a24a" stroke-width="36" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4">
    <!-- Outer square border flush to edges -->
    <rect x="18" y="18" width="476" height="476"/>
    <!-- ↖ arrowhead: connected L-shape, miter join creates sharp tip at (44,44) -->
    <path d="M 208,62 L 62,62 L 62,208"/>
    <!-- ↘ arrowhead: connected L-shape, miter join creates sharp tip at (468,468) -->
    <path d="M 304,450 L 450,450 L 450,304"/>
    <!-- Diagonal shaft connecting arrowheads (extended past corners for overlap) -->
    <line x1="56" y1="56" x2="456" y2="456"/>
  </g>
</svg>